name: kobeos-self-hosted-test

# Disposable test profile. The credentials below are intentionally public,
# low-value test credentials. Never use this overlay for production data.
# Launch with:
#   docker compose -f docker-compose.self-hosted.yml -f docker-compose.self-hosted.test.yml up -d --build
services:
  postgres:
    environment:
      POSTGRES_USER: kobe
      POSTGRES_PASSWORD: kobeos-test-db-password-2026
      POSTGRES_DB: kobeos

  api:
    # The test profile is self-contained and does not require .env.self-hosted.
    env_file: []
    environment:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: kobe
      DB_PASSWORD: kobeos-test-db-password-2026
      DB_DATABASE: kobeos
      DB_SYNCHRONIZE: "false"
      DB_MIGRATIONS_RUN: "true"
      JWT_SECRET: kobeos-test-jwt-secret-do-not-use-in-production-2026-08-25
      JWT_EXPIRES_IN: 15m
      REFRESH_EXPIRES_DAYS: 30
      REDIS_URL: redis://redis:6379
      KOBEOS_DEPLOYMENT: self-hosted
      KOBEOS_TEST_MODE: "true"
      CORS_ORIGIN: http://localhost:8080
      TENANT_BASE_DOMAIN: ""
      APP_PUBLIC_URL: http://localhost:8080
      APP_FRONTEND_URL: http://localhost:8080/
      META_LOGIN_CONFIG_ID: "1589072156006100"
      META_GRAPH_VERSION: v26.0

