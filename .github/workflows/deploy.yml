name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production

    steps:
      - name: Check deployment configuration
        id: deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=()
          [ -n "$DEPLOY_HOST" ] || missing+=("DEPLOY_HOST")
          [ -n "$DEPLOY_USER" ] || missing+=("DEPLOY_USER")
          [ -n "$DEPLOY_SSH_KEY" ] || missing+=("DEPLOY_SSH_KEY")

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Production deployment credentials are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            for name in "${missing[@]}"; do
              echo "::error::Missing required production deployment secret: $name"
            done
            echo "::error::Deployment aborted. Configure the missing secret(s) in the GitHub production environment."
            exit 1
          fi

      - name: Deploy via SSH
        if: ${{ steps.deployment.outputs.ready == 'true' }}
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
          TIKTOK_CREATOR_REDIRECT_URI: ${{ secrets.TIKTOK_CREATOR_REDIRECT_URI }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_REDIRECT_URI: ${{ secrets.META_REDIRECT_URI }}
          META_LOGIN_CONFIG_ID: ${{ secrets.META_LOGIN_CONFIG_ID }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          IG_WEBHOOK_VERIFY_TOKEN: ${{ secrets.IG_WEBHOOK_VERIFY_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: TIKTOK_CLIENT_KEY,TIKTOK_CLIENT_SECRET,TIKTOK_REDIRECT_URI,TIKTOK_CREATOR_REDIRECT_URI,META_APP_ID,META_APP_SECRET,META_REDIRECT_URI,META_LOGIN_CONFIG_ID,INSTAGRAM_APP_ID,INSTAGRAM_APP_SECRET,IG_WEBHOOK_VERIFY_TOKEN,GOOGLE_CLIENT_ID
          script: |
            set -e
            cd /opt/kobe-studio
            COMPOSE_FILE=server/docker-compose.prod.yml
            ENV_FILE=server/.env

            compose() {
              docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" "$@"
            }

            # TikTok Login Kit + Creator Social Publishing use the same app
            # credentials but separate registered callbacks. Provider secrets
            # never enter the source tree.
            if [ -n "${TIKTOK_CLIENT_KEY:-}" ] && [ -n "${TIKTOK_CLIENT_SECRET:-}" ]; then
              touch "$ENV_FILE"
              tmp_env="$(mktemp)"
              grep -vE '^(TIKTOK_CLIENT_KEY|TIKTOK_CLIENT_SECRET|TIKTOK_REDIRECT_URI|TIKTOK_CREATOR_REDIRECT_URI|TIKTOK_CREATOR_OAUTH_SCOPES)=' "$ENV_FILE" > "$tmp_env" || true
              printf '%s\n' \
                "TIKTOK_CLIENT_KEY=$TIKTOK_CLIENT_KEY" \
                "TIKTOK_CLIENT_SECRET=$TIKTOK_CLIENT_SECRET" \
                "TIKTOK_REDIRECT_URI=${TIKTOK_REDIRECT_URI:-https://api.kobeapptz.com/api/auth/oauth/tiktok/callback}" \
                "TIKTOK_CREATOR_REDIRECT_URI=${TIKTOK_CREATOR_REDIRECT_URI:-https://api.kobeapptz.com/api/social-scheduler/tiktok/oauth/callback}" \
                "TIKTOK_CREATOR_OAUTH_SCOPES=user.info.basic,user.info.profile,user.info.stats,video.list,video.publish" >> "$tmp_env"
              mv "$tmp_env" "$ENV_FILE"
            fi

            # Meta/Facebook Login is used for the global Kobe account login.
            if [ -n "${META_APP_ID:-}" ] && [ -n "${META_APP_SECRET:-}" ]; then
              touch "$ENV_FILE"
              tmp_env="$(mktemp)"
              grep -vE '^(META_APP_ID|META_APP_SECRET|META_REDIRECT_URI|META_LOGIN_CONFIG_ID|META_GRAPH_VERSION)=' "$ENV_FILE" > "$tmp_env" || true
              printf '%s\n' \
                "META_APP_ID=$META_APP_ID" \
                "META_APP_SECRET=$META_APP_SECRET" \
                "META_REDIRECT_URI=${META_REDIRECT_URI:-https://api.kobeapptz.com/api/auth/oauth/meta/callback}" \
                "META_LOGIN_CONFIG_ID=${META_LOGIN_CONFIG_ID:-}" \
                "META_GRAPH_VERSION=v26.0" >> "$tmp_env"
              mv "$tmp_env" "$ENV_FILE"
            fi

            # Instagram Professional uses Instagram Login through the Meta app.
            # Keep its app secret and webhook verify token in GitHub Environment
            # secrets; only write them to the server-side production .env.
            if [ -n "${INSTAGRAM_APP_ID:-}" ] && [ -n "${INSTAGRAM_APP_SECRET:-}" ]; then
              touch "$ENV_FILE"
              tmp_env="$(mktemp)"
              grep -vE '^(INSTAGRAM_APP_ID|INSTAGRAM_APP_SECRET|INSTAGRAM_REDIRECT_URI|INSTAGRAM_API_VERSION|INSTAGRAM_OAUTH_SCOPES|IG_WEBHOOK_VERIFY_TOKEN)=' "$ENV_FILE" > "$tmp_env" || true
              printf '%s\n' \
                "INSTAGRAM_APP_ID=$INSTAGRAM_APP_ID" \
                "INSTAGRAM_APP_SECRET=$INSTAGRAM_APP_SECRET" \
                "INSTAGRAM_REDIRECT_URI=https://api.kobeapptz.com/api/live-sales/instagram/oauth/callback" \
                "INSTAGRAM_API_VERSION=v26.0" \
                "INSTAGRAM_OAUTH_SCOPES=instagram_business_basic,instagram_business_content_publish,instagram_business_manage_comments,instagram_business_manage_messages,instagram_business_manage_insights" \
                "IG_WEBHOOK_VERIFY_TOKEN=${IG_WEBHOOK_VERIFY_TOKEN:-}" >> "$tmp_env"
              mv "$tmp_env" "$ENV_FILE"
            fi

            # Google uses one Web Client ID in both places: the API validates
            # the ID token against it, and Vite embeds it in the web bundle.
            # The value is optional until Google OAuth is configured.
            if [ -n "${GOOGLE_CLIENT_ID:-}" ]; then
              touch "$ENV_FILE"
              tmp_env="$(mktemp)"
              grep -vE '^(GOOGLE_CLIENT_ID|VITE_GOOGLE_CLIENT_ID)=' "$ENV_FILE" > "$tmp_env" || true
              printf '%s\n' \
                "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" \
                "VITE_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> "$tmp_env"
              mv "$tmp_env" "$ENV_FILE"
            fi

            # Pull the latest registry-built API image; the web image
            # is rebuilt locally from the source tree (next step).
            compose pull api

            # Pull latest source so Dockerfile.web sees fresh code, then
            # rebuild + tag the web image. `--pull` keeps the node:20-alpine
            # base layer current.
            if [ -d .git ]; then
              git pull --ff-only
              compose build --pull web
            else
              echo "⚠ /opt/kobe-studio is not a git checkout — skipping web rebuild."
              echo "  Provision a clone with: git clone <repo> /opt/kobe-studio"
            fi

            # Auto-generate VAPID keys for Web Push on the first deploy
            # that introduces them. Idempotent — the script refuses to
            # overwrite existing VAPID_* lines, so re-runs are safe.
            if [ -f "$ENV_FILE" ] && ! grep -q "^VAPID_PUBLIC_KEY=" "$ENV_FILE"; then
              echo "→ VAPID keys missing — generating now…"
              compose run --rm \
                -v "$PWD/$ENV_FILE:/app/.env" \
                api npm run vapid:generate || \
                echo "⚠ vapid:generate failed — push will stay disabled. Run manually: docker compose --env-file $ENV_FILE -f $COMPOSE_FILE run --rm api npm run vapid:generate"
            fi

            # The API image has DB_MIGRATIONS_RUN=true. Its startup runs any
            # pending migrations before the health check turns green, so a
            # bad migration fails the deploy instead of being ignored.
            compose up -d api web

            # Rolling restart — zero downtime where the proxy can keep the
            # old API while the replacement becomes healthy. nginx depends on both api +
            # web so omitting --no-deps lets it pick up new container IPs
            # if either backend service was rebuilt.
            compose exec -T nginx nginx -s reload || \
              compose up -d --no-deps nginx

            # Health checks: API + a HEAD on the SPA so we catch a broken
            # build artifact before customer traffic hits a 502.
            sleep 10
            curl -sf http://localhost:3000/api/health || (compose logs api --tail=50 && exit 1)
            curl -sfI http://localhost/ -H 'Host: kobeapptz.com' >/dev/null || \
              (compose logs web nginx --tail=50 && exit 1)

            echo "Deploy complete: $(date)"

      - name: Verify live Jumla deployment
        if: ${{ steps.deployment.outputs.ready == 'true' }}
        run: |
          set -euo pipefail

          echo "Checking production API health..."
          curl -fsS --retry 4 --retry-delay 3 --connect-timeout 10 \
            https://api.kobeapptz.com/api/health >/dev/null

          echo "Checking Jumla SPA..."
          curl -fsS --retry 4 --retry-delay 3 --connect-timeout 10 \
            https://jumla.kobeapptz.com/ -o /tmp/jumla.html
          grep -q 'id="root"' /tmp/jumla.html || {
            echo "::error::jumla.kobeapptz.com did not return the KobeOS SPA shell."
            exit 1
          }

          echo "Checking Jumla public marketplace API..."
          curl -fsS --retry 4 --retry-delay 3 --connect-timeout 10 \
            'https://api.kobeapptz.com/api/commerce-public/jumla/items?q=' \
            -o /tmp/jumla-items.json
          grep -Eq '^\s*\[' /tmp/jumla-items.json || {
            echo "::error::Jumla items endpoint did not return a JSON array."
            head -c 500 /tmp/jumla-items.json || true
            exit 1
          }

          echo "Jumla production verification passed."

