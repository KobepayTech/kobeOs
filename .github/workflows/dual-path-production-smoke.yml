name: Verify Dual Production Paths

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

env:
  SUPABASE_BACKUP_API_BASE: https://erimnjgpawuxesonkeoz.supabase.co/functions/v1/kobeos-backup

jobs:
  primary:
    name: Verify Cloudflare primary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check primary Lala API and web
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 25             https://api.kobeapptz.com/api/lala-public/health -o /tmp/primary-health.json
          jq -e '.status == "ok" and .database == "ready"' /tmp/primary-health.json >/dev/null

          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 25             https://lala.kobeapptz.com/ -o /tmp/primary-lala.html
          grep -q 'id="root"' /tmp/primary-lala.html

  backup:
    name: Verify Supabase emergency path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check independent API
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 25             -D /tmp/backup-headers.txt             "$SUPABASE_BACKUP_API_BASE/lala-public/health"             -o /tmp/backup-health.json

          jq -e '.status == "ok" and .database == "ready" and .mode == "supabase-backup"'             /tmp/backup-health.json >/dev/null
          grep -qi '^x-kobe-production-path: supabase-backup' /tmp/backup-headers.txt

      - name: Check independent emergency web
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 25             -D /tmp/backup-web-headers.txt             "$SUPABASE_BACKUP_API_BASE/app"             -o /tmp/backup-lala.html

          grep -q '<title>Lala · Independent Backup</title>' /tmp/backup-lala.html
          grep -qi '^x-kobe-production-path: supabase-backup' /tmp/backup-web-headers.txt

      - name: Check snapshot state
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 25             "$SUPABASE_BACKUP_API_BASE/health" -o /tmp/backup-state.json
          jq -e '.status == "ok" and .database == "ready"' /tmp/backup-state.json >/dev/null
