name: Verify Dual Production Paths

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BACKUP_API_HOST: ${{ vars.BACKUP_API_HOST }}
      BACKUP_WEB_HOST: ${{ vars.BACKUP_WEB_HOST }}
      GITHUB_PAGES_LALA: https://kobepaytech.github.io/kobeOs/lala/

    steps:
      - name: Require independent backup configuration
        run: |
          set -euo pipefail
          [ -n "${BACKUP_API_HOST:-}" ] || {
            echo "::error::BACKUP_API_HOST is not configured."
            exit 1
          }
          [ -n "${BACKUP_WEB_HOST:-}" ] || {
            echo "::error::BACKUP_WEB_HOST is not configured."
            exit 1
          }
          case "$BACKUP_API_HOST $BACKUP_WEB_HOST" in
            *kobeapptz.com*)
              echo "::error::Backup hosts are not independent: they must not live under kobeapptz.com."
              exit 1
              ;;
          esac

      - name: Verify Cloudflare primary path
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 25             https://api.kobeapptz.com/api/lala-public/health -o /tmp/primary-health.json
          jq -e '.status == "ok" and .database == "ready"' /tmp/primary-health.json >/dev/null

          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 25             https://lala.kobeapptz.com/ -o /tmp/primary-lala.html
          grep -q 'id="root"' /tmp/primary-lala.html

      - name: Verify direct backup path
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 25             -D /tmp/backup-headers.txt             "https://$BACKUP_API_HOST/api/lala-public/health"             -o /tmp/backup-health.json

          jq -e '.status == "ok" and .database == "ready"' /tmp/backup-health.json >/dev/null
          grep -qi '^x-kobe-production-path: backup-direct' /tmp/backup-headers.txt || {
            echo "::error::Backup API did not identify itself as the direct non-Cloudflare path."
            cat /tmp/backup-headers.txt
            exit 1
          }

          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 25             "https://$BACKUP_WEB_HOST/lala" -o /tmp/backup-web.html
          grep -q 'id="root"' /tmp/backup-web.html

      - name: Verify independent GitHub Pages emergency frontend
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 25             "$GITHUB_PAGES_LALA" -o /tmp/pages-lala.html
          grep -q 'id="root"' /tmp/pages-lala.html

          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 25             "${GITHUB_PAGES_LALA}failover-status.json" -o /tmp/pages-status.json
          jq -e '.cloudflareIndependent == true and .backupApiConfigured == true'             /tmp/pages-status.json >/dev/null

      - name: Confirm both data paths see the same Lala service
        run: |
          set -euo pipefail
          curl -fsS "https://api.kobeapptz.com/api/lala-public/health" -o /tmp/primary.json
          curl -fsS "https://$BACKUP_API_HOST/api/lala-public/health" -o /tmp/backup.json

          primary_db="$(jq -r '.database' /tmp/primary.json)"
          backup_db="$(jq -r '.database' /tmp/backup.json)"
          [ "$primary_db" = "ready" ] && [ "$backup_db" = "ready" ]

          echo "Cloudflare primary: healthy"
          echo "Independent backup: healthy"
          echo "GitHub Pages emergency frontend: healthy"
