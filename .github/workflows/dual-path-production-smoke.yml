name: Verify Dual Production Paths

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BACKUP_API_HOST: ${{ vars.BACKUP_API_HOST }}
      BACKUP_WEB_HOST: ${{ vars.BACKUP_WEB_HOST }}
      SUPABASE_BACKUP_API_BASE: https://erimnjgpawuxesonkeoz.supabase.co/functions/v1/kobeos-backup
      GITHUB_PAGES_LALA: https://kobepaytech.github.io/kobeOs/lala/

    steps:
      - name: Verify Cloudflare primary path
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 25             https://api.kobeapptz.com/api/lala-public/health -o /tmp/primary-health.json
          jq -e '.status == "ok" and .database == "ready"' /tmp/primary-health.json >/dev/null

          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 25             https://lala.kobeapptz.com/ -o /tmp/primary-lala.html
          grep -q 'id="root"' /tmp/primary-lala.html

      - name: Verify independent Supabase backup API
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 25 \
            -D /tmp/backup-headers.txt \
            "$SUPABASE_BACKUP_API_BASE/lala-public/health" \
            -o /tmp/backup-health.json

          jq -e '.status == "ok" and .database == "ready" and .mode == "supabase-backup"' \
            /tmp/backup-health.json >/dev/null
          grep -qi '^x-kobe-production-path: supabase-backup' /tmp/backup-headers.txt || {
            echo "::error::Supabase backup did not identify itself as the independent path."
            cat /tmp/backup-headers.txt
            exit 1
          }

      - name: Verify independent GitHub Pages emergency frontend
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 25             "$GITHUB_PAGES_LALA" -o /tmp/pages-lala.html
          grep -q 'id="root"' /tmp/pages-lala.html

          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 25             "${GITHUB_PAGES_LALA}failover-status.json" -o /tmp/pages-status.json
          jq -e '.cloudflareIndependent == true and .backupApiConfigured == true'             /tmp/pages-status.json >/dev/null

      - name: Report dual-path state
        run: |
          echo "Cloudflare primary: checked separately"
          echo "Supabase independent API: healthy"
          echo "GitHub Pages emergency frontend: healthy"
