name: KobeOS Smoke Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  frontend-smoke:
    name: Frontend smoke test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build frontend
        run: npm run build

  backend-smoke:
    name: Backend smoke build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Use the runner FFmpeg for the backend build
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          echo "FFMPEG_BIN=$(command -v ffmpeg)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Build backend
        run: npm run build
