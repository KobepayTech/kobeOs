name: Diagnose Lala Origin on Self-Hosted Runner

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/lala-origin-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command "& '{0}'"
    steps:
      - name: Check production capabilities without exposing secrets
        run: |
          $ErrorActionPreference = 'Continue'

          $cloudflaredCmd = Get-Command cloudflared -ErrorAction SilentlyContinue
          $dockerCmd = Get-Command docker -ErrorAction SilentlyContinue
          $cloudflaredServices = @(Get-Service -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -match 'cloudflared|cloudflare' -or $_.DisplayName -match 'cloudflared|cloudflare'
          })
          $cloudflaredProcesses = @(Get-Process cloudflared -ErrorAction SilentlyContinue)

          $processToken = -not [string]::IsNullOrWhiteSpace($env:CLOUDFLARED_TOKEN)
          $machineToken = -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable('CLOUDFLARED_TOKEN', 'Machine'))
          $userToken = -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable('CLOUDFLARED_TOKEN', 'User'))

          Write-Host "cloudflared_command_present=$([bool]$cloudflaredCmd)"
          Write-Host "docker_command_present=$([bool]$dockerCmd)"
          Write-Host "cloudflared_service_count=$($cloudflaredServices.Count)"
          Write-Host "cloudflared_process_count=$($cloudflaredProcesses.Count)"
          Write-Host "tunnel_token_available_to_runner=$($processToken -or $machineToken -or $userToken)"

          foreach ($svc in $cloudflaredServices) {
            Write-Host "cloudflared_service_status=$($svc.Status)"
          }

          if ($dockerCmd) {
            docker version --format 'docker_server_available={{.Server.Version}}' 2>$null
            if ($LASTEXITCODE -ne 0) {
              Write-Host 'docker_server_available=false'
            }
          }

          foreach ($port in 80, 3000) {
            $listening = @(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue).Count -gt 0
            Write-Host ("localhost_port_" + $port + "_listening=" + $listening)
          }

      - name: Probe local KobeOS endpoints
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            $health = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3000/api/health' -TimeoutSec 5
            Write-Host "local_api_health_status=$($health.StatusCode)"
          } catch {
            Write-Host 'local_api_health_status=unreachable'
          }

          try {
            $web = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1/' -TimeoutSec 5
            Write-Host "local_web_status=$($web.StatusCode)"
          } catch {
            Write-Host 'local_web_status=unreachable'
          }

      - name: Identify how the KobeOS API is launched (so recovery can restart it)
        run: |
          $ErrorActionPreference = 'Continue'
          # The 530 is caused by the API on :3000 being down, and the tunnel
          # self-heal deliberately won't start the app. This step reports HOW the
          # API is meant to run so we can wire an app-restart into recovery.
          # Read-only: it never starts/stops anything and prints no secrets.

          Write-Host '--- owner of port 3000 ---'
          $conn = Get-NetTCPConnection -LocalPort 3000 -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($conn) {
            $p = Get-Process -Id $conn.OwningProcess -ErrorAction SilentlyContinue
            if ($p) { Write-Host "port3000_process=$($p.ProcessName) pid=$($p.Id) path=$($p.Path)" }
            else    { Write-Host "port3000_owning_pid=$($conn.OwningProcess) (process not found)" }
          } else { Write-Host 'port3000_owner=none (nothing is listening — the API is not running)' }

          Write-Host '--- candidate API processes (node / electron / kobe) ---'
          Get-Process -ErrorAction SilentlyContinue |
            Where-Object { $_.ProcessName -match 'node|electron|kobe' } |
            ForEach-Object { Write-Host ("process={0} pid={1} path={2}" -f $_.ProcessName, $_.Id, $_.Path) }

          Write-Host '--- candidate services (kobe / node / pm2 / nssm) ---'
          Get-Service -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'kobe|node|pm2|nssm|winsw' -or $_.DisplayName -match 'kobe|node|pm2|KobeOS' } |
            ForEach-Object { Write-Host ("service={0} display='{1}' status={2} startType={3}" -f $_.Name, $_.DisplayName, $_.Status, $_.StartType) }

          Write-Host '--- pm2 present? ---'
          $pm2 = Get-Command pm2 -ErrorAction SilentlyContinue
          Write-Host "pm2_present=$([bool]$pm2)"
          if ($pm2) { pm2 jlist 2>$null | Out-String | Write-Host }

          Write-Host '--- scheduled tasks mentioning kobe ---'
          Get-ScheduledTask -ErrorAction SilentlyContinue |
            Where-Object { $_.TaskName -match 'kobe' -or $_.TaskPath -match 'kobe' } |
            ForEach-Object { Write-Host ("task={0}{1} state={2}" -f $_.TaskPath, $_.TaskName, $_.State) }

          Write-Host '--- run-at-login entries mentioning kobe ---'
          foreach ($k in 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run','HKCU:\Software\Microsoft\Windows\CurrentVersion\Run') {
            $props = Get-ItemProperty -Path $k -ErrorAction SilentlyContinue
            if ($props) {
              $props.PSObject.Properties |
                Where-Object { $_.Value -match 'kobe' -or $_.Name -match 'kobe' } |
                ForEach-Object { Write-Host ("run_key={0} name={1}" -f $k, $_.Name) }
            }
          }

          Write-Host '--- kobe docker containers (if docker present) ---'
          if (Get-Command docker -ErrorAction SilentlyContinue) {
            docker ps -a --filter 'name=kobe' --format 'container={{.Names}} state={{.State}} status={{.Status}}' 2>$null | Write-Host
          } else { Write-Host 'docker_not_present=true' }
