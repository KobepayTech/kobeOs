            $lala = Join-Path $env:RUNNER_TEMP 'kobeos-lala-pages'
            $jumla = Join-Path $env:RUNNER_TEMP 'kobeos-jumla-pages'
            foreach ($dir in @($lala, $jumla)) {
              if (Test-Path -LiteralPath $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }
              New-Item -ItemType Directory -Force -Path $dir | Out-Null
              Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'dist\*') -Destination $dir -Recurse -Force
            }
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'deploy\lala-pages\_redirects') -Destination (Join-Path $lala '_redirects') -Force
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'deploy\jumla-pages\_redirects') -Destination (Join-Path $jumla '_redirects') -Force

            & npx.cmd --yes wrangler@4 pages deploy $lala --project-name kobeos-lala --branch master --commit-hash '${{ github.sha }}' --commit-message 'Deploy Lala from KobeOS origin recovery'
            if ($LASTEXITCODE -ne 0) { throw "Lala Pages deployment failed with exit code $LASTEXITCODE." }

            & npx.cmd --yes wrangler@4 pages deploy $jumla --project-name kobeos-jumla --branch master --commit-hash '${{ github.sha }}' --commit-message 'Deploy Jumla from KobeOS origin recovery'
