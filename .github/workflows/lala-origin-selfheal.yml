name: Recover Lala Origin on Self-Hosted Runner

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/lala-origin-selfheal.yml'
      - 'scripts/install-live-backend-autostart.ps1'
      - 'scripts/run-live-origin-supervisor.cjs'
      - 'scripts/run-live-backend.ps1'
      - 'scripts/deploy-public-pages-from-origin.ps1'
  workflow_dispatch:
  # MVP recovery: keep the existing origin + local PostgreSQL online behind Cloudflare Tunnel.
  # The runner service starts with Windows. This watchdog then repairs embedded
  # PostgreSQL, the API supervisor, or Cloudflare whenever health checks fail.
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: read

concurrency:
  group: lala-origin-selfheal
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command "& '{0}'"
    steps:
      - name: Checkout recovery scripts
        uses: actions/checkout@v4

      - name: Locate the stable KobeOS origin
        id: origin
        run: |
          $ErrorActionPreference = 'Stop'

          # Never supervise the ephemeral Actions checkout: the runner deletes
          # and replaces it. The diagnostic workflow identified C:\KobeOS\app
          # as the stable production tree.
          $candidates = @(
            'C:\KobeOS\app',
            'C:\kobeos\app',
            'C:\kobeOs\app'
          ) | Select-Object -Unique

          $origin = $candidates | Where-Object {
            (Test-Path -LiteralPath (Join-Path $_ 'server\dist\main.js') -PathType Leaf) -and
            (Test-Path -LiteralPath (Join-Path $_ 'server\.env.production') -PathType Leaf)
          } | Select-Object -First 1

          if (-not $origin) {
            throw 'Stable KobeOS origin not found. Expected the server bundle and .env.production under C:\KobeOS\app.'
          }

          $origin = (Resolve-Path -LiteralPath $origin).Path
          Write-Host "origin_root=$origin"
          "root=$origin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install or repair automatic KobeOS origin startup
        env:
          ORIGIN_ROOT: ${{ steps.origin.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE\scripts\install-live-backend-autostart.ps1" `
            -RepoRoot $env:ORIGIN_ROOT `
            -HealthTimeoutSeconds 240

      - name: Check stable origin release
        id: release
        env:
          ORIGIN_ROOT: ${{ steps.origin.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $marker = Join-Path $env:ORIGIN_ROOT 'logs\deployed-master-sha.txt'
          $current = ''
          if (Test-Path -LiteralPath $marker -PathType Leaf) {
            $current = (Get-Content -LiteralPath $marker -TotalCount 1).Trim()
          }
          $target = '${{ github.sha }}'
          if ($current -eq $target) {
            Write-Host 'Stable origin already matches this master commit.'
            'update=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host 'Stable origin is behind master; preparing an atomic backend update.'
            'update=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Build current KobeOS backend
        if: steps.release.outputs.update == 'true'
        working-directory: server
        run: |
          $ErrorActionPreference = 'Stop'
          & npm.cmd ci --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit code $LASTEXITCODE." }
          & npm.cmd run build
          if ($LASTEXITCODE -ne 0) { throw "Backend build failed with exit code $LASTEXITCODE." }

      - name: Apply migrations and atomically update stable backend
        if: steps.release.outputs.update == 'true'
        env:
          ORIGIN_ROOT: ${{ steps.origin.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'

          $origin = $env:ORIGIN_ROOT
          $logs = Join-Path $origin 'logs'
          $lock = Join-Path $logs 'deployment.lock'
          $marker = Join-Path $logs 'deployed-master-sha.txt'
          $currentDist = Join-Path $origin 'server\dist'
          $nextDist = Join-Path $origin 'server\dist.next'
          $previousDist = Join-Path $origin 'server\dist.previous'
          $sourceDist = Join-Path $env:GITHUB_WORKSPACE 'server\dist'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null

          if (-not (Test-Path -LiteralPath (Join-Path $sourceDist 'main.js') -PathType Leaf)) {
            throw 'Built backend bundle is missing server\dist\main.js.'
          }

          Set-Content -LiteralPath $lock -Value '${{ github.sha }}' -Encoding ASCII
          try {
            $backendProcesses = @(Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
              Where-Object {
                $_.CommandLine -and
                $_.CommandLine.IndexOf($origin, [StringComparison]::OrdinalIgnoreCase) -ge 0 -and
                $_.CommandLine -match 'server[\\/]dist[\\/]main\.js'
              })
            foreach ($process in $backendProcesses) {
              Stop-Process -Id $process.ProcessId -Force -ErrorAction SilentlyContinue
            }

            $env:NODE_ENV = 'production'
            $env:DB_HOST = '127.0.0.1'
            $env:DB_PORT = '5433'
            $env:DB_USERNAME = 'kobeos'
            $env:DB_PASSWORD = 'kobeos_live'
            $env:DB_DATABASE = 'kobeos'
            $env:DB_SSL = 'false'
            $env:DB_SYNCHRONIZE = 'false'
            Push-Location (Join-Path $env:GITHUB_WORKSPACE 'server')
            try {
              & npm.cmd run migration:run
              if ($LASTEXITCODE -ne 0) { throw "Migration command failed with exit code $LASTEXITCODE." }
            } finally {
              Pop-Location
            }

            if (Test-Path -LiteralPath $nextDist) {
              Remove-Item -LiteralPath $nextDist -Recurse -Force
            }
            Copy-Item -LiteralPath $sourceDist -Destination $nextDist -Recurse -Force

            if (Test-Path -LiteralPath $previousDist) {
              Remove-Item -LiteralPath $previousDist -Recurse -Force
            }
            if (Test-Path -LiteralPath $currentDist) {
              Move-Item -LiteralPath $currentDist -Destination $previousDist
            }
            Move-Item -LiteralPath $nextDist -Destination $currentDist

            Set-Content -LiteralPath $marker -Value '${{ github.sha }}' -Encoding ASCII
            Write-Host 'Stable KobeOS backend and database migrations updated to current master.'
          } catch {
            if (-not (Test-Path -LiteralPath $currentDist) -and (Test-Path -LiteralPath $previousDist)) {
              Move-Item -LiteralPath $previousDist -Destination $currentDist
            }
            throw
          } finally {
            Remove-Item -LiteralPath $lock -Force -ErrorAction SilentlyContinue
          }

          $deadline = (Get-Date).AddSeconds(180)
          do {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3000/api/health' -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                Write-Host 'Updated stable KobeOS API is healthy locally.'
                break
              }
            } catch { }
            Start-Sleep -Seconds 3
          } while ((Get-Date) -lt $deadline)

          if (-not (Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3000/api/health' -TimeoutSec 5)) {
            throw 'Updated stable backend did not become healthy after the atomic deployment.'
          }

      - name: Skip connector recovery if the public API is healthy
        id: gate
        run: |
          $ErrorActionPreference = 'Stop'
          $healthy = $true
          foreach ($url in @(
            'https://api.kobeapptz.com/api/health',
            'https://api.kobeapptz.com/api/lala-public/search'
          )) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 12
              if ($response.StatusCode -ne 200) { $healthy = $false }
            } catch {
              $healthy = $false
            }
          }

          if ($healthy) {
            Write-Host 'Public KobeOS API is healthy; full-origin startup is installed and no connector restart is needed.'
          } else {
            Write-Host 'Local API is healthy but the public API is failing; restarting the existing Cloudflare connector.'
          }
          "healthy=$($healthy.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate the existing Cloudflare connector
        if: steps.gate.outputs.healthy != 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $services = @(Get-Service -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -match 'cloudflared|cloudflare' -or $_.DisplayName -match 'cloudflared|cloudflare'
          })
          if ($services.Count -lt 1) {
            throw 'No existing Cloudflare service is installed on this runner; refusing to create or repurpose a tunnel.'
          }

          $api = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3000/api/health' -TimeoutSec 8
          if ($api.StatusCode -ne 200) {
            throw "Local KobeOS API returned HTTP $($api.StatusCode) after startup repair."
          }

          # Lala's frontend is deployed to Cloudflare Pages. Port 80 is not an
          # origin prerequisite; only the API on port 3000 belongs on this box.
          Write-Host 'Existing local KobeOS API origin and Cloudflare connector verified.'
          $services | ForEach-Object { Write-Host "cloudflared_service_status_before=$($_.Status)" }

      - name: Restart existing Cloudflare connector
        if: steps.gate.outputs.healthy != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $services = @(Get-Service -ErrorAction Stop | Where-Object {
            $_.Name -match 'cloudflared|cloudflare' -or $_.DisplayName -match 'cloudflared|cloudflare'
          })

          $restartSucceeded = $true
          try {
            foreach ($service in $services) {
              if ($service.Status -eq 'Running') {
                Restart-Service -Name $service.Name -Force -ErrorAction Stop
              } else {
                Start-Service -Name $service.Name -ErrorAction Stop
              }
            }
          } catch {
            # The runner service is intentionally non-administrative. Leave the
            # existing connector untouched and let the off-box job determine
            # whether it reconnected to the now-healthy origin on its own.
            $restartSucceeded = $false
            Write-Host 'connector_restart_result=not_permitted_or_failed'
          }

          if ($restartSucceeded) {
            Start-Sleep -Seconds 12
            $services = @(Get-Service -ErrorAction Stop | Where-Object {
              $_.Name -match 'cloudflared|cloudflare' -or $_.DisplayName -match 'cloudflared|cloudflare'
            })
            $services | ForEach-Object { Write-Host "cloudflared_service_status_after=$($_.Status)" }
            if ($services.Where({ $_.Status -ne 'Running' }).Count -gt 0) {
              throw 'Cloudflare connector service did not return to Running state.'
            }
          }

      - name: Deploy Lala and Jumla Pages from origin credentials when available
        continue-on-error: true
        env:
          ORIGIN_ROOT: ${{ steps.origin.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE\scripts\deploy-public-pages-from-origin.ps1" -OriginRoot $env:ORIGIN_ROOT

  verify-public:
    name: Verify KobeOS API off-box
    needs: recover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the KobeOS API through Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          api_urls=(
            'https://api.kobeapptz.com/api/health'
            'https://api.kobeapptz.com/api/lala-public/search'
          )

          healthy=false
          for attempt in $(seq 1 12); do
            healthy=true
            for url in "${api_urls[@]}"; do
              if ! curl --fail --silent --show-error \
                --output /dev/null \
                --connect-timeout 10 \
                --max-time 20 \
                "$url"; then
                healthy=false
              fi
            done
            if [ "$healthy" = true ]; then
              echo "KobeOS API is healthy through Cloudflare on attempt $attempt."
              break
            fi
            echo "Off-box API verification attempt $attempt/12 did not pass yet."
            sleep 5
          done

          [ "$healthy" = true ] || {
            echo 'The local recovery job passed, but the API is still unreachable through Cloudflare.' >&2
            exit 1
          }

          verify_spa() {
            domain="$1"
            label="$2"
            html="/tmp/${label}.html"
            assets="/tmp/${label}-assets"
            mkdir -p "$assets"

            curl -fsS --retry 6 --retry-delay 3 --connect-timeout 10 --max-time 30 \
              "https://$domain/" -o "$html"
            grep -q 'id="root"' "$html" || {
              echo "::error::$domain did not return the KobeOS SPA shell."
              exit 1
            }

            grep -oE 'src="[^"]+\.js"' "$html" | sed -E 's/^src="//;s/"$//' | while read -r asset; do
              case "$asset" in
                http://*|https://*) url="$asset" ;;
                /*) url="https://$domain$asset" ;;
                *) url="https://$domain/$asset" ;;
              esac
              name="$(basename "${asset%%\?*}")"
              curl -fsS --connect-timeout 10 --max-time 30 "$url" -o "$assets/$name"
            done

            if grep -R -q -E 'erimnjgpawuxesonkeoz|kobeos-backup|supabase\.co/functions/v1' "$assets"; then
              echo "::error::$domain is still serving the removed emergency-database frontend bundle."
              exit 1
            fi
            echo "$domain is serving a clean KobeOS frontend bundle."
          }

          verify_spa 'lala.kobeapptz.com' 'lala'
          verify_spa 'jumla.kobeapptz.com' 'jumla'

