name: Recover Lala Origin on Self-Hosted Runner

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/lala-origin-selfheal.yml'
  workflow_dispatch:
  # Auto-heal: run every 10 minutes on the self-hosted origin. The "skip if
  # already healthy" gate below makes a healthy run a no-op, so this only ever
  # restarts the connector when Cloudflare is actually returning 530/1033 —
  # turning the reactive recovery into an unattended watchdog. (A self-hosted
  # scheduled job only fires while the runner/origin box is up, which is exactly
  # the case where a dropped tunnel is recoverable.)
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command "& '{0}'"
    steps:
      - name: Skip if the origin is already serving through Cloudflare
        id: gate
        run: |
          $ErrorActionPreference = 'Stop'
          # If the PUBLIC endpoints already return 200 there is nothing to heal —
          # exit without touching the connector so a scheduled run never bounces
          # a working tunnel. Only a real outage (530/1033/timeout) falls through.
          $healthy = $true
          foreach ($u in @('https://api.kobeapptz.com/api/health', 'https://lala.kobeapptz.com/')) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri $u -TimeoutSec 12
              if ($r.StatusCode -ne 200) { $healthy = $false }
            } catch { $healthy = $false }
          }
          if ($healthy) {
            Write-Host 'Public origin already healthy (HTTP 200) — no recovery needed.'
          } else {
            Write-Host 'Public origin is failing — proceeding to restart the connector.'
          }
          "healthy=$($healthy.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate this runner is an existing KobeOS origin
        id: preflight
        if: steps.gate.outputs.healthy != 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $services = @(Get-Service -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -match 'cloudflared|cloudflare' -or $_.DisplayName -match 'cloudflared|cloudflare'
          })
          if ($services.Count -lt 1) {
            throw 'No existing Cloudflare service is installed on this runner; refusing to create or repurpose a tunnel.'
          }

          try {
            $api = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3000/api/health' -TimeoutSec 5
          } catch {
            throw 'Local KobeOS API is not healthy on port 3000; refusing to restart a tunnel on this machine.'
          }
          if ($api.StatusCode -ne 200) {
            throw "Local KobeOS API returned HTTP $($api.StatusCode); refusing recovery."
          }

          try {
            $web = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1/' -TimeoutSec 5
          } catch {
            throw 'Local KobeOS web is not healthy on port 80; refusing to restart a tunnel on this machine.'
          }
          if ($web.StatusCode -ne 200) {
            throw "Local KobeOS web returned HTTP $($web.StatusCode); refusing recovery."
          }

          Write-Host 'Existing local KobeOS origin verified.'
          $services | ForEach-Object { Write-Host "cloudflared_service_status_before=$($_.Status)" }

      - name: Restart existing Cloudflare connector
        if: steps.gate.outputs.healthy != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $services = @(Get-Service -ErrorAction Stop | Where-Object {
            $_.Name -match 'cloudflared|cloudflare' -or $_.DisplayName -match 'cloudflared|cloudflare'
          })
          foreach ($svc in $services) {
            if ($svc.Status -eq 'Running') {
              Restart-Service -Name $svc.Name -Force -ErrorAction Stop
            } else {
              Start-Service -Name $svc.Name -ErrorAction Stop
            }
          }
          Start-Sleep -Seconds 12
          $services = @(Get-Service -ErrorAction Stop | Where-Object {
            $_.Name -match 'cloudflared|cloudflare' -or $_.DisplayName -match 'cloudflared|cloudflare'
          })
          $services | ForEach-Object { Write-Host "cloudflared_service_status_after=$($_.Status)" }
          if ($services.Where({ $_.Status -ne 'Running' }).Count -gt 0) {
            throw 'Cloudflare connector service did not return to Running state.'
          }

      - name: Verify Lala through Cloudflare
        if: steps.gate.outputs.healthy != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $attempts = 8
          for ($i = 1; $i -le $attempts; $i++) {
            try {
              $health = Invoke-WebRequest -UseBasicParsing -Uri 'https://api.kobeapptz.com/api/lala-public/health' -TimeoutSec 15
              $web = Invoke-WebRequest -UseBasicParsing -Uri 'https://lala.kobeapptz.com/' -TimeoutSec 15
              if ($health.StatusCode -eq 200 -and $web.StatusCode -eq 200) {
                Write-Host "Lala origin recovered on attempt $i."
                exit 0
              }
            } catch {
              Write-Host "Public verification attempt $i/$attempts did not pass yet."
            }
            Start-Sleep -Seconds 5
          }
          throw 'Existing connector restarted, but Lala is still not reachable through Cloudflare.'
