name: Recover Lala Origin on Self-Hosted Runner

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/lala-origin-selfheal.yml'
      - 'scripts/install-live-backend-autostart.ps1'
      - 'scripts/run-live-backend.ps1'
  workflow_dispatch:
  # The runner service starts with Windows. This watchdog then repairs the API
  # startup task or Cloudflare connector whenever the public API is unhealthy.
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: read

concurrency:
  group: lala-origin-selfheal
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command "& '{0}'"
    steps:
      - name: Checkout recovery scripts
        uses: actions/checkout@v4

      - name: Locate the stable KobeOS origin
        id: origin
        run: |
          $ErrorActionPreference = 'Stop'

          # Never supervise the ephemeral Actions checkout: the runner deletes
          # and replaces it. The diagnostic workflow identified C:\KobeOS\app
          # as the stable production tree.
          $candidates = @(
            'C:\KobeOS\app',
            'C:\kobeos\app',
            'C:\kobeOs\app'
          ) | Select-Object -Unique

          $origin = $candidates | Where-Object {
            (Test-Path -LiteralPath (Join-Path $_ 'scripts\run-live-backend.ps1') -PathType Leaf) -and
            (Test-Path -LiteralPath (Join-Path $_ 'server\dist\main.js') -PathType Leaf) -and
            (Test-Path -LiteralPath (Join-Path $_ 'server\.env.production') -PathType Leaf)
          } | Select-Object -First 1

          if (-not $origin) {
            throw 'Stable KobeOS origin not found. Expected the launcher, server bundle, and .env.production under C:\KobeOS\app.'
          }

          $origin = (Resolve-Path -LiteralPath $origin).Path
          Write-Host "origin_root=$origin"
          "root=$origin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install or repair automatic KobeOS API startup
        env:
          ORIGIN_ROOT: ${{ steps.origin.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE\scripts\install-live-backend-autostart.ps1" `
            -RepoRoot $env:ORIGIN_ROOT `
            -HealthTimeoutSeconds 120

      - name: Skip connector recovery if the public API is healthy
        id: gate
        run: |
          $ErrorActionPreference = 'Stop'
          $healthy = $true
          foreach ($url in @(
            'https://api.kobeapptz.com/api/health',
            'https://api.kobeapptz.com/api/lala-public/health'
          )) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 12
              if ($response.StatusCode -ne 200) { $healthy = $false }
            } catch {
              $healthy = $false
            }
          }

          if ($healthy) {
            Write-Host 'Public KobeOS API is healthy; the startup task is installed and no connector restart is needed.'
          } else {
            Write-Host 'Local API is healthy but the public API is failing; restarting the existing Cloudflare connector.'
          }
          "healthy=$($healthy.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate the existing Cloudflare connector
        if: steps.gate.outputs.healthy != 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $services = @(Get-Service -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -match 'cloudflared|cloudflare' -or $_.DisplayName -match 'cloudflared|cloudflare'
          })
          if ($services.Count -lt 1) {
            throw 'No existing Cloudflare service is installed on this runner; refusing to create or repurpose a tunnel.'
          }

          $api = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3000/api/health' -TimeoutSec 8
          if ($api.StatusCode -ne 200) {
            throw "Local KobeOS API returned HTTP $($api.StatusCode) after startup repair."
          }

          # Lala's frontend is deployed to Cloudflare Pages. Port 80 is not an
          # origin prerequisite; only the API on port 3000 belongs on this box.
          Write-Host 'Existing local KobeOS API origin and Cloudflare connector verified.'
          $services | ForEach-Object { Write-Host "cloudflared_service_status_before=$($_.Status)" }

      - name: Restart existing Cloudflare connector
        if: steps.gate.outputs.healthy != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $services = @(Get-Service -ErrorAction Stop | Where-Object {
            $_.Name -match 'cloudflared|cloudflare' -or $_.DisplayName -match 'cloudflared|cloudflare'
          })
          foreach ($service in $services) {
            if ($service.Status -eq 'Running') {
              Restart-Service -Name $service.Name -Force -ErrorAction Stop
            } else {
              Start-Service -Name $service.Name -ErrorAction Stop
            }
          }

          Start-Sleep -Seconds 12
          $services = @(Get-Service -ErrorAction Stop | Where-Object {
            $_.Name -match 'cloudflared|cloudflare' -or $_.DisplayName -match 'cloudflared|cloudflare'
          })
          $services | ForEach-Object { Write-Host "cloudflared_service_status_after=$($_.Status)" }
          if ($services.Where({ $_.Status -ne 'Running' }).Count -gt 0) {
            throw 'Cloudflare connector service did not return to Running state.'
          }

      - name: Verify the KobeOS API through Cloudflare
        if: steps.gate.outputs.healthy != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $attempts = 8
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            try {
              $health = Invoke-WebRequest -UseBasicParsing -Uri 'https://api.kobeapptz.com/api/health' -TimeoutSec 15
              $lala = Invoke-WebRequest -UseBasicParsing -Uri 'https://api.kobeapptz.com/api/lala-public/health' -TimeoutSec 15
              if ($health.StatusCode -eq 200 -and $lala.StatusCode -eq 200) {
                Write-Host "KobeOS API origin recovered on attempt $attempt."
                exit 0
              }
            } catch {
              Write-Host "Public API verification attempt $attempt/$attempts did not pass yet."
            }
            Start-Sleep -Seconds 5
          }
          throw 'The local API and connector are running, but the KobeOS API is still unreachable through Cloudflare.'

