name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release so desktop apps auto-update (no tag needed)'
        type: boolean
        default: false
  push:
    branches: [master, main]
    tags: ['v*']
    paths:
      - 'electron/**'
      - 'src/**'
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - 'server/package.json'
      - 'vite.config.*'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'electron/**'
      - 'src/**'
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - 'server/package.json'
      - 'vite.config.*'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── Frontend ────────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
        # Note: npm install (not ci) because --legacy-peer-deps is needed for
        # @nestjs/swagger peer dependency conflicts with @nestjs/common versions.

      - name: Check Windows build scripts
        run: node scripts/check-windows-build-scripts.mjs

      - name: Build frontend with TypeScript check
        run: npm run build

      # ── Backend ─────────────────────────────────────────────────────────────
      - name: Install server dependencies
        run: npm install --legacy-peer-deps
        working-directory: server

      - name: Bundle NestJS backend
        run: npm run build:bundle

      # ── Pre-build steps ─────────────────────────────────────────────────────
      - name: Regenerate core integrity manifest
        run: npm run core:manifest

      - name: Verify manifest was generated
        run: |
          if (!(Test-Path "build/core-manifest.json")) {
            Write-Error "core-manifest.json was not generated"
            exit 1
          }
          $manifest = Get-Content "build/core-manifest.json" | ConvertFrom-Json
          $count = ($manifest.files | Get-Member -MemberType NoteProperty).Count
          Write-Host "Manifest contains $count files"
          if ($count -eq 0) {
            Write-Error "Manifest is empty"
            exit 1
          }
        shell: pwsh

      - name: Bundle Visual C++ runtime next to PostgreSQL binaries
        shell: pwsh
        run: |
          # The MSVC-built PostgreSQL binaries depend on the VC++ runtime. Without
          # it, initdb.exe fails to launch with 0xC0000135 (STATUS_DLL_NOT_FOUND).
          $binDir = "node_modules/@embedded-postgres/windows-x64/native/bin"
          if (!(Test-Path $binDir)) { Write-Error "Postgres bin dir not found: $binDir"; exit 1 }

          function Find-Dll($name) {
            $sys = Join-Path $env:WINDIR "System32\$name"
            if (Test-Path $sys) { return $sys }
            $redist = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\$name" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($redist) { return $redist.FullName }
            return $null
          }

          $required = @("vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll")
          $optional = @("msvcp140_1.dll","msvcp140_2.dll","concrt140.dll","vccorlib140.dll")

          foreach ($d in $required) {
            $src = Find-Dll $d
            if (!$src) { Write-Error "Required runtime DLL not found on runner: $d"; exit 1 }
            Copy-Item $src -Destination $binDir -Force
            Write-Host "Bundled (required): $d  <- $src"
          }
          foreach ($d in $optional) {
            $src = Find-Dll $d
            if ($src) { Copy-Item $src -Destination $binDir -Force; Write-Host "Bundled (optional): $d" }
          }

      - name: Prepare direct PostgreSQL resources
        run: npm run prepare:postgres

      - name: Download Visual C++ 2015-2022 x64 Redistributable
        run: |
          $url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $dest = "build\vcredist\vc_redist.x64.exe"
          New-Item -ItemType Directory -Force -Path "build\vcredist" | Out-Null

          # aka.ms redirects to a CDN that cuts connections often enough to fail
          # a build on its own ("The response ended prematurely"), so a single
          # attempt makes every Windows build hostage to one flaky request.
          # Treat a short file as a failed attempt too, not as a hard exit.
          $attempts = 4
          $size = 0
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            try {
              Write-Host "Downloading vc_redist.x64.exe from $url (attempt $attempt/$attempts)"
              Remove-Item -LiteralPath $dest -Force -ErrorAction SilentlyContinue
              Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing -TimeoutSec 120
              $size = (Get-Item $dest).Length
              if ($size -ge 5MB) { break }
              Write-Host "Got only $([math]::Round($size/1MB, 1)) MB; retrying."
            } catch {
              Write-Host "Attempt $attempt failed: $($_.Exception.Message)"
              $size = 0
            }
            if ($attempt -lt $attempts) { Start-Sleep -Seconds ([math]::Pow(2, $attempt)) }
          }

          if ($size -lt 5MB) {
            Write-Error "vc_redist.x64.exe could not be downloaded after $attempts attempts (last size $size bytes)"
            exit 1
          }
          Write-Host "Downloaded: $([math]::Round($size/1MB, 1)) MB"
        shell: pwsh

      - name: Download cloudflared
        run: npm run download:cloudflared

      # Not continue-on-error: this step failing used to ship an installer with
      # no AI runtime at all, and the build still reported green. The assistant
      # being missing is a release-blocking defect, not a warning.
      - name: Download Ollama (local AI runtime)
        run: npm run download:ollama

      # Bundle the offline AI model into the installer. This used to require the
      # BUNDLE_AI_MODELS repo variable to be 'true'; it never was, so every
      # release shipped the Ollama runtime with nothing to run and the assistant
      # was dead on arrival. Bundling is now the default and opting OUT is the
      # explicit act (set BUNDLE_AI_MODELS to 'false').
      #
      # Sources (see scripts/fetch-bundled-models.cjs): KOBE_MODELS_DIR for a
      # self-hosted runner with the GGUFs on local disk, otherwise the per-model
      # `url` in models/bundled/models.json. Required, not fail-soft: shipping an
      # installer with no model is the defect this replaces.
      - name: Fetch bundled AI models
        if: vars.BUNDLE_AI_MODELS != 'false'
        run: npm run fetch:models
        env:
          KOBE_MODELS_DIR: ${{ vars.KOBE_MODELS_DIR }}
          KOBE_MODELS_AUTH: ${{ secrets.KOBE_MODELS_AUTH }}
          KOBE_MODELS_REQUIRED: '1'

      # ── Build installer ─────────────────────────────────────────────────────
      # PUBLISH the update feed to the GitHub Release (installer + latest.yml +
      # .blockmap for delta updates) either on a version tag OR when the
      # "publish" input is checked on a manual run — the latter lets you ship an
      # auto-update with one click from the Actions tab, no git tag required.
      # electron-builder creates the release for the current package.json version.
      # Other builds publish nothing.
      - name: Build Windows installer
        run: npx electron-builder --win --publish ${{ (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy vc_redist.x64.exe next to installer
        run: |
          Copy-Item "build\vcredist\vc_redist.x64.exe" "release\vc_redist.x64.exe" -Force
          Write-Host "Copied vc_redist.x64.exe to release\"
        shell: pwsh

      # ── Smoke tests ─────────────────────────────────────────────────────────
      - name: 'Smoke test: verify installer exists and is non-trivial'
        run: |
          $exes = Get-ChildItem release\*.exe -ErrorAction SilentlyContinue
          if ($exes.Count -eq 0) {
            Write-Error "No .exe found in release/"
            exit 1
          }
          foreach ($exe in $exes) {
            Write-Host "$($exe.Name): $([math]::Round($exe.Length/1MB, 1)) MB"
            if ($exe.Length -lt 10MB) {
              Write-Error "$($exe.Name) is suspiciously small (<10 MB)"
              exit 1
            }
          }
          Write-Host "Smoke test passed"
        shell: pwsh

      # Bundling a model pushes the installer toward GitHub's 2 GiB per-release-
      # asset ceiling. Crossing it does not fail the build — it fails the upload,
      # so auto-update quietly stops receiving new versions. Catch it here, where
      # the message can say what to do, instead of in a publish run.
      # v1.11.1 shipped at 1.43 GiB; qwen2.5-0.5b-q4_k_m adds ~0.46 GiB.
      - name: 'Smoke test: installer fits the release asset limit'
        run: |
          $limit = 2GB
          $warn = 1.8GB
          $failed = $false
          foreach ($exe in Get-ChildItem release\*.exe) {
            $gb = [math]::Round($exe.Length/1GB, 2)
            if ($exe.Length -ge $limit) {
              Write-Error "$($exe.Name) is ${gb} GiB, at or over GitHub's 2 GiB release asset limit. Publishing would fail and desktop auto-update would stop. Use a smaller bundled model in models/bundled/models.json, or host it outside the installer."
              $failed = $true
            } elseif ($exe.Length -ge $warn) {
              Write-Host "::warning::$($exe.Name) is ${gb} GiB — within 200 MiB of the 2 GiB release asset limit."
            } else {
              Write-Host "$($exe.Name): ${gb} GiB (limit 2 GiB)"
            }
          }
          if ($failed) { exit 1 }
        shell: pwsh

      - name: 'Smoke test: verify the AI model is bundled'
        if: vars.BUNDLE_AI_MODELS != 'false'
        run: |
          # electron/main.cjs registers these with `ollama create` on first boot;
          # no gguf here means a fresh install has an AI engine and nothing to run.
          $dir = "release\win-unpacked\resources\models"
          $ggufs = @(Get-ChildItem "$dir\*.gguf" -ErrorAction SilentlyContinue)
          if ($ggufs.Count -eq 0) {
            Write-Error "No .gguf bundled in $dir — the assistant would have no model on a fresh install."
            exit 1
          }
          foreach ($g in $ggufs) { Write-Host "bundled model: $($g.Name) ($([math]::Round($g.Length/1MB, 1)) MB)" }
        shell: pwsh

      - name: 'Smoke test: verify vc_redist.x64.exe is bundled'
        run: |
          $redist = "release\vc_redist.x64.exe"
          if (!(Test-Path $redist)) {
            Write-Error "vc_redist.x64.exe not found in release\"
            exit 1
          }
          $size = (Get-Item $redist).Length
          Write-Host "vc_redist.x64.exe: $([math]::Round($size/1MB, 1)) MB"
          if ($size -lt 5MB) {
            Write-Error "vc_redist.x64.exe is too small -- may be corrupt"
            exit 1
          }
          Write-Host "VC++ redist bundled correctly"
        shell: pwsh

      - name: 'Smoke test: verify asar contains core files'
        run: |
          $asar = "release\win-unpacked\resources\app.asar"
          if (!(Test-Path $asar)) {
            Write-Error "app.asar not found at $asar"
            exit 1
          }
          npx asar list $asar | Select-String "electron/main.cjs","electron/preload.cjs","electron/update-manager.cjs"
          Write-Host "Core files present in asar"
        shell: pwsh

      # Assert the exact path electron/main.cjs spawns (see ollamaBinary there).
      # A missing runtime is invisible until a user asks the assistant something
      # and gets "Kobe AI runtime is offline", so it has to fail the build here.
      - name: 'Smoke test: verify the AI runtime is bundled'
        run: |
          $ollama = "release\win-unpacked\resources\ollama\win-x64\ollama.exe"
          if (!(Test-Path $ollama)) {
            Write-Error "AI runtime missing from the installer: $ollama"
            exit 1
          }
          if ((Get-Item $ollama).Length -lt 1MB) {
            Write-Error "Bundled ollama.exe is suspiciously small: $ollama"
            exit 1
          }
          Write-Host "AI runtime bundled: $([math]::Round((Get-Item $ollama).Length/1MB, 1)) MB"

      - name: 'Smoke test: verify postgres binaries and VC++ runtime'
        run: |
          $directBin = "release\win-unpacked\resources\postgres\bin"
          foreach ($binary in @("initdb.exe","postgres.exe","pg_ctl.exe")) {
            $target = Join-Path $directBin $binary
            if (!(Test-Path $target)) {
              Write-Error "Direct PostgreSQL resource missing: $target"
              exit 1
            }
            if ((Get-Item $target).Length -lt 100KB) {
              Write-Error "Direct PostgreSQL binary is suspiciously small: $target"
              exit 1
            }
          }
          foreach ($dll in @("vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll")) {
            $target = Join-Path $directBin $dll
            if (!(Test-Path $target)) {
              Write-Error "Direct PostgreSQL VC++ runtime missing: $target"
              exit 1
            }
          }
          Write-Host "Direct PostgreSQL resources present: $directBin"

          $unpackedRoot = "release\win-unpacked\resources\app.asar.unpacked\node_modules"
          $unpacked = "$unpackedRoot\@embedded-postgres\windows-x64"

          Write-Host "Contents of app.asar.unpacked\node_modules:"
          Get-ChildItem $unpackedRoot -ErrorAction SilentlyContinue | Select-Object Name

          if (!(Test-Path $unpacked)) {
            Write-Error "PostgreSQL platform package not found: $unpacked"
            exit 1
          }

          $initdb = Get-ChildItem "$unpacked" -Recurse -Filter "initdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$initdb) {
            Write-Error "initdb.exe not found inside $unpacked"
            exit 1
          }
          Write-Host "initdb.exe: $($initdb.FullName) ($([math]::Round($initdb.Length/1KB))KB)"

          if ($initdb.Length -lt 100KB) {
            Write-Error "initdb.exe is suspiciously small ($($initdb.Length) bytes) -- may be a stub"
            exit 1
          }

          # Verify VC++ runtime is bundled next to initdb.exe
          $initdbDir = Split-Path $initdb.FullName
          foreach ($dll in @("vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll")) {
            if (!(Test-Path (Join-Path $initdbDir $dll))) {
              Write-Error "$dll not bundled next to initdb.exe -- startup would fail with 0xC0000135"
              exit 1
            }
          }
          Write-Host "VC++ runtime DLLs present next to initdb.exe"

          # Verify pg-bootstrap.cjs resolves
          npx asar list "release\win-unpacked\resources\app.asar" | Select-String "pg-bootstrap"
          Write-Host "Postgres smoke test passed"
        shell: pwsh

      # ── Artifacts ───────────────────────────────────────────────────────────
      - name: List release artifacts
        run: |
          Write-Host "=== Release Artifacts ==="
          Get-ChildItem release\ -Recurse | Select-Object FullName, @{N="SizeMB";E={[math]::Round($_.Length/1MB,1)}}
        shell: pwsh

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KobeOS-Windows-Setup
          path: |
            release/*.exe
            release/vc_redist.x64.exe
          retention-days: 30

      # electron-builder --publish always (above) already uploaded the installer,
      # latest.yml and .blockmap to the tag's Release. Here we only ADD the
      # VC++ redistributable to that same Release (electron-builder doesn't
      # publish it), so a first-time manual download has everything.
      - name: Add vc_redist to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: release/vc_redist.x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
