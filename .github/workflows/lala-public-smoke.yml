name: Lala Public Production Smoke

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/lala-public-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve public hosts
        run: |
          set -u
          echo "=== lala.kobeapptz.com ==="
          getent ahosts lala.kobeapptz.com || true
          echo
          echo "=== api.kobeapptz.com ==="
          getent ahosts api.kobeapptz.com || true

      - name: Check Lala web
        id: web
        continue-on-error: true
        run: |
          set -euo pipefail
          code="$(curl -sS --connect-timeout 10 --max-time 30 -D /tmp/lala-web-headers.txt -o /tmp/lala-web-body.html -w '%{http_code}' https://lala.kobeapptz.com/)"
          echo "http_status=$code"
          cat /tmp/lala-web-headers.txt
          echo
          head -c 4000 /tmp/lala-web-body.html || true
          echo
          grep -Eo 'Error [0-9]{4}|error code: [0-9]{4}|[0-9]{4}: [^<]+' /tmp/lala-web-body.html | head -20 || true
          [[ "$code" =~ ^2[0-9][0-9]$ ]]

      - name: Check Lala API search
        id: search
        continue-on-error: true
        run: |
          set -euo pipefail
          code="$(curl -sS --connect-timeout 10 --max-time 30 -D /tmp/lala-search-headers.txt -o /tmp/lala-search.json -w '%{http_code}' https://api.kobeapptz.com/api/lala-public/search)"
          echo "http_status=$code"
          cat /tmp/lala-search-headers.txt
          echo
          head -c 4000 /tmp/lala-search.json || true
          echo
          if [[ "$code" =~ ^2[0-9][0-9]$ ]]; then
            jq -e 'type == "array"' /tmp/lala-search.json >/dev/null
          else
            grep -Eo 'Error [0-9]{4}|error code: [0-9]{4}|[0-9]{4}: [^<]+' /tmp/lala-search.json | head -20 || true
            exit 1
          fi

      - name: Check Lala API MVP health endpoint
        id: health
        continue-on-error: true
        run: |
          set -euo pipefail
          code="$(curl -sS --connect-timeout 10 --max-time 30 -D /tmp/lala-health-headers.txt -o /tmp/lala-health.json -w '%{http_code}' https://api.kobeapptz.com/api/lala-public/health)"
          echo "http_status=$code"
          cat /tmp/lala-health-headers.txt
          echo
          head -c 4000 /tmp/lala-health.json || true
          echo
          if [[ "$code" =~ ^2[0-9][0-9]$ ]]; then
            jq -e '.status == "ok" and .database == "ready"' /tmp/lala-health.json >/dev/null
          else
            grep -Eo 'Error [0-9]{4}|error code: [0-9]{4}|[0-9]{4}: [^<]+' /tmp/lala-health.json | head -20 || true
            exit 1
          fi

      - name: Report production state
        run: |
          echo "web_outcome=${{ steps.web.outcome }}"
          echo "search_outcome=${{ steps.search.outcome }}"
          echo "health_outcome=${{ steps.health.outcome }}"
          if [ "${{ steps.web.outcome }}" = "success" ] &&              [ "${{ steps.search.outcome }}" = "success" ] &&              [ "${{ steps.health.outcome }}" = "success" ]; then
            echo "Lala production smoke passed."
            exit 0
          fi
          echo "::error::Lala production is not fully serving the MVP yet."
          exit 1
