name: Verify Independent Lala Backup

on:
  push:
    branches: [master]
    paths:
      - 'src/public/Lala.tsx'
      - 'src/public/LalaPassport.tsx'
      - 'src/public/api.ts'
      - 'supabase/functions/kobeos-backup/index.ts'
      - '.github/workflows/deploy-kijani-demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_BACKUP_API_BASE: https://erimnjgpawuxesonkeoz.supabase.co/functions/v1/kobeos-backup

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify backup API health
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 25             -D /tmp/headers.txt             "$SUPABASE_BACKUP_API_BASE/health"             -o /tmp/health.json
          jq -e '.status == "ok" and .database == "ready" and .mode == "supabase-backup"'             /tmp/health.json >/dev/null
          grep -qi '^x-kobe-production-path: supabase-backup' /tmp/headers.txt

      - name: Verify emergency Lala web
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 25             "$SUPABASE_BACKUP_API_BASE/app"             -o /tmp/lala-backup.html
          grep -q '<title>Lala · Independent Backup</title>' /tmp/lala-backup.html
          grep -q 'CLOUDFLARE-INDEPENDENT BACKUP' /tmp/lala-backup.html

      - name: Verify backup search contract
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 25             "$SUPABASE_BACKUP_API_BASE/lala-public/search?guests=1"             -o /tmp/search.json
          jq -e 'type == "array"' /tmp/search.json >/dev/null
          echo "Independent Supabase Lala backup is reachable and serving its public contract."
