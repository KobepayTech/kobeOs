name: Deploy Cloudflare Primary API

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Capture preview Worker errors without deploying
        required: false
        default: false
        type: boolean
      cutover:
        description: 'Enable api.kobeapptz.com Worker Route after preview verification'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preview:
    name: Deploy Cloudflare API preview
    runs-on: ubuntu-latest
    if: ${{ inputs.diagnostics_only != true && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && vars.CLOUDFLARE_CONTAINER_PRIMARY_ENABLED == 'true')) }}
    # Reuse the existing production environment because Lala/Jumla already keep
    # the Cloudflare account token and account ID there.
    environment: production
    outputs:
      verified: ${{ steps.verify-preview.outcome == 'success' }}
      deploy_sha: ${{ env.DEPLOY_SHA }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
      PRIMARY_API_DB_HOST: ${{ secrets.PRIMARY_API_DB_HOST || secrets.DB_HOST || secrets.KOBE_SHARED_DB_HOST }}
      PRIMARY_API_DB_USERNAME: ${{ secrets.PRIMARY_API_DB_USERNAME || secrets.DB_USERNAME }}
      PRIMARY_API_DB_PASSWORD: ${{ secrets.PRIMARY_API_DB_PASSWORD || secrets.DB_PASSWORD }}
      PRIMARY_API_DB_DATABASE: ${{ secrets.PRIMARY_API_DB_DATABASE || vars.PRIMARY_API_DB_DATABASE || 'neondb' }}
      PRIMARY_API_JWT_SECRET: ${{ secrets.PRIMARY_API_JWT_SECRET || secrets.JWT_SECRET }}
      PRIMARY_API_PROVIDER_ENCRYPTION_KEY: ${{ secrets.PRIMARY_API_PROVIDER_ENCRYPTION_KEY || secrets.PROVIDER_ENCRYPTION_KEY }}
      PRIMARY_API_EXTRA_SECRETS_JSON: ${{ secrets.PRIMARY_API_EXTRA_SECRETS_JSON }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || secrets.CF_ZONE_ID || vars.CLOUDFLARE_ZONE_ID || vars.CF_ZONE_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cloudflare deployment dependencies
        working-directory: deploy/cloudflare-primary-api
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Worker bundle and container configuration
        working-directory: deploy/cloudflare-primary-api
        run: npx wrangler deploy --dry-run --config wrangler.jsonc --outdir .wrangler-dry-run

      - name: Validate production Worker route configuration
        working-directory: deploy/cloudflare-primary-api
        run: npx wrangler deploy --dry-run --config wrangler.production.jsonc --outdir .wrangler-production-dry-run

      - name: Test deployment configuration checks
        run: node --test deploy/cloudflare-primary-api/scripts/*.node-test.mjs

      - name: Check Cloudflare and runtime credentials
        run: node deploy/cloudflare-primary-api/scripts/check-deployment-config.mjs

      - name: Build Worker runtime secrets file
        id: runtime-secrets
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/kobeos-primary-api-secrets.json"
          umask 077
          jq -n \
            --arg DB_HOST "$PRIMARY_API_DB_HOST" \
            --arg DB_USERNAME "$PRIMARY_API_DB_USERNAME" \
            --arg DB_PASSWORD "$PRIMARY_API_DB_PASSWORD" \
            --arg DB_DATABASE "$PRIMARY_API_DB_DATABASE" \
            --arg JWT_SECRET "$PRIMARY_API_JWT_SECRET" \
            --arg PROVIDER_ENCRYPTION_KEY "$PRIMARY_API_PROVIDER_ENCRYPTION_KEY" \
            '{
              DB_HOST: $DB_HOST,
              DB_USERNAME: $DB_USERNAME,
              DB_PASSWORD: $DB_PASSWORD,
              DB_DATABASE: $DB_DATABASE,
              JWT_SECRET: $JWT_SECRET,
              PROVIDER_ENCRYPTION_KEY: $PROVIDER_ENCRYPTION_KEY
            }' > "$secrets_file"

          if [ -n "${PRIMARY_API_EXTRA_SECRETS_JSON:-}" ]; then
            printf '%s' "$PRIMARY_API_EXTRA_SECRETS_JSON" |
              jq -e 'type == "object"' > "$RUNNER_TEMP/kobeos-primary-extra-secrets.json"
            jq -s '.[0] * .[1]' \
              "$secrets_file" \
              "$RUNNER_TEMP/kobeos-primary-extra-secrets.json" \
              > "$RUNNER_TEMP/kobeos-primary-api-secrets.merged.json"
            mv "$RUNNER_TEMP/kobeos-primary-api-secrets.merged.json" "$secrets_file"
          fi

          chmod 600 "$secrets_file"
          echo "path=$secrets_file" >> "$GITHUB_OUTPUT"

      - name: Deploy workers.dev preview
        id: preview-deploy
        working-directory: deploy/cloudflare-primary-api
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc --secrets-file "${{ steps.runtime-secrets.outputs.path }}" | tee "$RUNNER_TEMP/kobeos-preview-deploy.log"
          preview_url="$(grep -Eo 'https://kobeos-primary-api\.[a-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/kobeos-preview-deploy.log" | head -n 1)"
          [ -n "$preview_url" ] || { echo "::error::Deployment returned no workers.dev preview URL"; exit 1; }
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Verify preview database health and container marker
        id: verify-preview
        env:
          PREVIEW_URL: ${{ steps.preview-deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/kobeos-preview-headers"
          body="$RUNNER_TEMP/kobeos-preview-health.json"
          for attempt in $(seq 1 18); do
            if curl -fsS -D "$headers" --connect-timeout 10 --max-time 25 "$PREVIEW_URL/api/health" -o "$body"; then
              if grep -qi '^x-kobe-production-path: cloudflare-container' "$headers" && jq -e '.status == "ok" and .db == "connected"' "$body" >/dev/null; then
                echo "Preview deployed and database health verified." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Preview did not verify a healthy Cloudflare Container connected to PostgreSQL"
          exit 1

  cutover:
    name: Enable api.kobeapptz.com Worker Route
    needs: preview
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cutover == true && needs.preview.outputs.verified == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
      PRIMARY_API_DB_HOST: ${{ secrets.PRIMARY_API_DB_HOST || secrets.DB_HOST || secrets.KOBE_SHARED_DB_HOST }}
      PRIMARY_API_DB_USERNAME: ${{ secrets.PRIMARY_API_DB_USERNAME || secrets.DB_USERNAME }}
      PRIMARY_API_DB_PASSWORD: ${{ secrets.PRIMARY_API_DB_PASSWORD || secrets.DB_PASSWORD }}
      PRIMARY_API_DB_DATABASE: ${{ secrets.PRIMARY_API_DB_DATABASE || vars.PRIMARY_API_DB_DATABASE || 'neondb' }}
      PRIMARY_API_JWT_SECRET: ${{ secrets.PRIMARY_API_JWT_SECRET || secrets.JWT_SECRET }}
      PRIMARY_API_PROVIDER_ENCRYPTION_KEY: ${{ secrets.PRIMARY_API_PROVIDER_ENCRYPTION_KEY || secrets.PROVIDER_ENCRYPTION_KEY }}
      PRIMARY_API_EXTRA_SECRETS_JSON: ${{ secrets.PRIMARY_API_EXTRA_SECRETS_JSON }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || secrets.CF_ZONE_ID || vars.CLOUDFLARE_ZONE_ID || vars.CF_ZONE_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preview.outputs.deploy_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cloudflare deployment dependencies
        working-directory: deploy/cloudflare-primary-api
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check runtime credentials for cutover
        run: node deploy/cloudflare-primary-api/scripts/check-deployment-config.mjs --cutover

      - name: Build Worker runtime secrets file
        id: runtime-secrets
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/kobeos-primary-api-secrets.json"
          umask 077
          jq -n \
            --arg DB_HOST "$PRIMARY_API_DB_HOST" \
            --arg DB_USERNAME "$PRIMARY_API_DB_USERNAME" \
            --arg DB_PASSWORD "$PRIMARY_API_DB_PASSWORD" \
            --arg DB_DATABASE "$PRIMARY_API_DB_DATABASE" \
            --arg JWT_SECRET "$PRIMARY_API_JWT_SECRET" \
            --arg PROVIDER_ENCRYPTION_KEY "$PRIMARY_API_PROVIDER_ENCRYPTION_KEY" \
            '{
              DB_HOST: $DB_HOST,
              DB_USERNAME: $DB_USERNAME,
              DB_PASSWORD: $DB_PASSWORD,
              DB_DATABASE: $DB_DATABASE,
              JWT_SECRET: $JWT_SECRET,
              PROVIDER_ENCRYPTION_KEY: $PROVIDER_ENCRYPTION_KEY
            }' > "$secrets_file"

          if [ -n "${PRIMARY_API_EXTRA_SECRETS_JSON:-}" ]; then
            printf '%s' "$PRIMARY_API_EXTRA_SECRETS_JSON" |
              jq -e 'type == "object"' > "$RUNNER_TEMP/kobeos-primary-extra-secrets.json"
            jq -s '.[0] * .[1]' \
              "$secrets_file" \
              "$RUNNER_TEMP/kobeos-primary-extra-secrets.json" \
              > "$RUNNER_TEMP/kobeos-primary-api-secrets.merged.json"
            mv "$RUNNER_TEMP/kobeos-primary-api-secrets.merged.json" "$secrets_file"
          fi
          chmod 600 "$secrets_file"
          echo "path=$secrets_file" >> "$GITHUB_OUTPUT"

      - name: Deploy production Worker Route
        id: production-deploy
        working-directory: deploy/cloudflare-primary-api
        run: npx wrangler deploy --config wrangler.production.jsonc --secrets-file "${{ steps.runtime-secrets.outputs.path }}"

      - name: Verify public production marker
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          for attempt in $(seq 1 18); do
            if curl -fsS -D "$headers" --connect-timeout 10 --max-time 25 https://api.kobeapptz.com/api/health >/dev/null; then
              if grep -qi '^x-kobe-production-path: cloudflare-container' "$headers"; then
                echo "Cloudflare primary API is live."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::api.kobeapptz.com did not verify against the Cloudflare Container."
          exit 1

      - name: Roll back Worker Route if verification fails
        if: ${{ failure() && steps.production-deploy.outcome == 'success' }}
        run: |
          set -euo pipefail
          routes_url="https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/workers/routes"
          curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "$routes_url" > "$RUNNER_TEMP/cloudflare-routes.json"

          route_id="$(jq -r '
            .result[]
            | select(.pattern == "api.kobeapptz.com/*" and .script == "kobeos-primary-api")
            | .id
          ' "$RUNNER_TEMP/cloudflare-routes.json" | head -n 1)"

          if [ -z "$route_id" ] || [ "$route_id" = "null" ]; then
            echo "::warning::No KobeOS production Worker Route found to remove."
            exit 0
          fi

          curl -fsS -X DELETE             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "$routes_url/$route_id" > "$RUNNER_TEMP/cloudflare-route-delete.json"

          jq -e '.success == true' "$RUNNER_TEMP/cloudflare-route-delete.json" >/dev/null
          echo "Cloudflare Worker Route removed; api.kobeapptz.com is back on the unchanged legacy DNS origin."

  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deployment tools
        working-directory: deploy/cloudflare-primary-api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture Worker errors while checking preview health
        working-directory: deploy/cloudflare-primary-api
        shell: bash
        run: |
          set -uo pipefail
          log_file="$RUNNER_TEMP/kobeos-worker-tail.jsonl"
          timeout 100s npx wrangler tail kobeos-primary-api --format json > "$log_file" 2>&1 &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true' EXIT
          sleep 8
          for attempt in 1 2; do
            curl -sS --connect-timeout 10 --max-time 35 -i https://kobeos-primary-api.sosteristephen.workers.dev/api/health || true
            sleep 3
          done
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          echo 'Worker trace (health requests only):'
          grep -A 6 -E '"exceptions"|"logs"' "$log_file" | tail -n 80 || true
