name: Deploy Cloudflare Primary API

on:
  push:
    branches:
      - feat/cloudflare-primary-api
    paths:
      - 'deploy/cloudflare-primary-api/**'
      - '.github/workflows/deploy-cloudflare-primary-api.yml'
  workflow_dispatch:
    inputs:
      cutover:
        description: 'Attach api.kobeapptz.com after preview verification'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preview:
    name: Deploy Cloudflare API preview
    runs-on: ubuntu-latest
    # Reuse the existing production environment because Lala/Jumla already keep
    # the Cloudflare account token and account ID there.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cloudflare deployment dependencies
        working-directory: deploy/cloudflare-primary-api
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Worker bundle and container configuration
        working-directory: deploy/cloudflare-primary-api
        run: npx wrangler deploy --dry-run --config wrangler.jsonc --outdir .wrangler-dry-run

      - name: Check Cloudflare credentials
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || {
            echo "::error::Missing CLOUDFLARE_API_TOKEN/CF_API_TOKEN in the production environment"
            exit 1
          }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || {
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID/CF_ACCOUNT_ID in the production environment"
            exit 1
          }

      - name: Deploy workers.dev preview
        working-directory: deploy/cloudflare-primary-api
        run: npx wrangler deploy --config wrangler.jsonc

  cutover:
    name: Attach api.kobeapptz.com
    needs: preview
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cutover == true }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cloudflare deployment dependencies
        working-directory: deploy/cloudflare-primary-api
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Deploy production custom domain
        working-directory: deploy/cloudflare-primary-api
        run: npx wrangler deploy --config wrangler.production.jsonc

      - name: Verify public production marker
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          for attempt in $(seq 1 18); do
            if curl -fsS -D "$headers" --connect-timeout 10 --max-time 25 https://api.kobeapptz.com/api/health >/dev/null; then
              if grep -qi '^x-kobe-production-path: cloudflare-container' "$headers"; then
                echo "Cloudflare primary API is live."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::api.kobeapptz.com did not verify against the Cloudflare Container."
          exit 1
