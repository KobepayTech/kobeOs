name: Release Windows Origin MVP

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release-windows-origin-mvp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-windows-origin-mvp
  cancel-in-progress: false

jobs:
  release-origin:
    name: Release API and public apps
    runs-on: [self-hosted, windows]
    timeout-minutes: 35
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command "& '{0}'"

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Locate stable production origin
        id: origin
        run: |
          $ErrorActionPreference = 'Stop'
          $origin = @(
            'C:\KobeOS\app',
            'C:\kobeos\app',
            'C:\kobeOs\app'
          ) | Select-Object -Unique | Where-Object {
            (Test-Path -LiteralPath (Join-Path $_ 'server\dist\main.js') -PathType Leaf) -and
            (Test-Path -LiteralPath (Join-Path $_ 'server\.env.production') -PathType Leaf)
          } | Select-Object -First 1

          if (-not $origin) {
            throw 'Stable KobeOS origin not found under C:\KobeOS\app.'
          }

          $origin = (Resolve-Path -LiteralPath $origin).Path
          "root=$origin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "origin_root=$origin"

      - name: Build reviewed backend release
        working-directory: server
        run: |
          $ErrorActionPreference = 'Stop'
          & npm.cmd ci --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) {
            throw "Backend npm ci failed with exit code $LASTEXITCODE."
          }
          & npm.cmd run build
          if ($LASTEXITCODE -ne 0) {
            throw "Backend build failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path -LiteralPath 'dist\main.js' -PathType Leaf)) {
            throw 'Built backend bundle is missing server\dist\main.js.'
          }

      - name: Atomically release backend with health rollback
        env:
          ORIGIN_ROOT: ${{ steps.origin.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $origin = $env:ORIGIN_ROOT
          $logs = Join-Path $origin 'logs'
          $lock = Join-Path $logs 'deployment.lock'
          $marker = Join-Path $logs 'deployed-master-sha.txt'
          $current = Join-Path $origin 'server\dist'
          $next = Join-Path $origin 'server\dist.next'
          $previous = Join-Path $origin 'server\dist.previous'
          $failed = Join-Path $origin 'server\dist.failed'
          $source = Join-Path $env:GITHUB_WORKSPACE 'server\dist'

          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          foreach ($path in @($next, $failed)) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }
          Copy-Item -LiteralPath $source -Destination $next -Recurse -Force
          Set-Content -LiteralPath $lock -Value '${{ github.sha }}' -Encoding ASCII

          try {
            Start-Sleep -Seconds 5
            if (Test-Path -LiteralPath $previous) {
              Remove-Item -LiteralPath $previous -Recurse -Force
            }
            Move-Item -LiteralPath $current -Destination $previous
            Move-Item -LiteralPath $next -Destination $current
          } finally {
            Remove-Item -LiteralPath $lock -Force -ErrorAction SilentlyContinue
          }

          function Test-Release {
            try {
              $api = Invoke-RestMethod -Uri 'http://127.0.0.1:3000/api/health' -TimeoutSec 8
              $lala = Invoke-RestMethod -Uri 'http://127.0.0.1:3000/api/lala-public/health' -TimeoutSec 12
              $search = Invoke-RestMethod -Uri 'http://127.0.0.1:3000/api/lala-public/search' -TimeoutSec 15
              return (
                $api.status -eq 'ok' -and
                $api.db -eq 'connected' -and
                $lala.status -eq 'ok' -and
                $lala.database -eq 'ready' -and
                $search -is [System.Array]
              )
            } catch {
              return $false
            }
          }

          $healthy = $false
          $deadline = (Get-Date).AddMinutes(4)
          do {
            if (Test-Release) {
              $healthy = $true
              break
            }
            Start-Sleep -Seconds 4
          } while ((Get-Date) -lt $deadline)

          if (-not $healthy) {
            Write-Host 'New backend failed release health checks; restoring previous bundle.'
            Set-Content -LiteralPath $lock -Value 'rollback' -Encoding ASCII
            try {
              Start-Sleep -Seconds 5
              if (Test-Path -LiteralPath $current) {
                Move-Item -LiteralPath $current -Destination $failed
              }
              Move-Item -LiteralPath $previous -Destination $current
            } finally {
              Remove-Item -LiteralPath $lock -Force -ErrorAction SilentlyContinue
            }

            $rollbackHealthy = $false
            $rollbackDeadline = (Get-Date).AddMinutes(3)
            do {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3000/api/health' -TimeoutSec 8
                if ($response.StatusCode -eq 200) {
                  $rollbackHealthy = $true
                  break
                }
              } catch { }
              Start-Sleep -Seconds 4
            } while ((Get-Date) -lt $rollbackDeadline)

            if (-not $rollbackHealthy) {
              throw 'New release failed and the previous backend did not recover.'
            }
            throw 'New release failed database-backed health checks; previous backend restored.'
          }

          Set-Content -LiteralPath $marker -Value '${{ github.sha }}' -Encoding ASCII
          Write-Host 'backend_release=success'

      - name: Deploy current Lala and Jumla bundles
        env:
          ORIGIN_ROOT: ${{ steps.origin.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(
            & "$env:GITHUB_WORKSPACE\scripts\deploy-public-pages-from-origin.ps1" -OriginRoot $env:ORIGIN_ROOT
          )
          $lines | ForEach-Object { Write-Host $_ }
          if ($lines -notcontains 'origin_pages_deploy=success') {
            throw 'Cloudflare Pages deployment did not run because usable origin credentials were not found.'
          }

  verify-off-box:
    name: Verify complete public MVP
    needs: release-origin
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify API, Lala, and Jumla
        shell: bash
        run: |
          set -euo pipefail

          retry_json() {
            url="$1"
            output="$2"
            for attempt in $(seq 1 12); do
              if curl -fsS --connect-timeout 10 --max-time 30 "$url" -o "$output"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          retry_json 'https://api.kobeapptz.com/api/health' /tmp/api-health.json
          jq -e '.status == "ok" and .db == "connected"' /tmp/api-health.json >/dev/null

          retry_json 'https://api.kobeapptz.com/api/lala-public/health' /tmp/lala-health.json
          jq -e '.status == "ok" and .database == "ready"' /tmp/lala-health.json >/dev/null

          retry_json 'https://api.kobeapptz.com/api/lala-public/search' /tmp/lala-search.json
          jq -e 'type == "array"' /tmp/lala-search.json >/dev/null

          retry_json 'https://api.kobeapptz.com/api/commerce-public/jumla/items?q=' /tmp/jumla-items.json
          jq -e 'type == "array"' /tmp/jumla-items.json >/dev/null

          for domain in lala.kobeapptz.com jumla.kobeapptz.com; do
            curl -fsS --retry 10 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 30 "https://$domain/" -o "/tmp/$domain.html"
            grep -q 'id="root"' "/tmp/$domain.html"
          done

          echo 'public_mvp_verification=success'
