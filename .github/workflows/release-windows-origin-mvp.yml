name: Release Windows Origin MVP

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release-windows-origin-mvp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-windows-origin-mvp
  cancel-in-progress: false

jobs:
  release-origin:
    name: Release API and public apps
    runs-on: [self-hosted, windows]
    timeout-minutes: 35
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command "& '{0}'"

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Locate stable production origin
        id: origin
        run: |
          $ErrorActionPreference = 'Stop'
          $origin = @(
            'C:\KobeOS\app',
            'C:\kobeos\app',
            'C:\kobeOs\app'
          ) | Select-Object -Unique | Where-Object {
            (Test-Path -LiteralPath (Join-Path $_ 'server\dist\main.js') -PathType Leaf) -and
            (Test-Path -LiteralPath (Join-Path $_ 'server\.env.production') -PathType Leaf)
          } | Select-Object -First 1

          if (-not $origin) {
            throw 'Stable KobeOS origin not found under C:\KobeOS\app.'
          }

          $origin = (Resolve-Path -LiteralPath $origin).Path
          "root=$origin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "origin_root=$origin"

      - name: Build reviewed backend release
        working-directory: server
        run: |
          $ErrorActionPreference = 'Stop'
          & npm.cmd ci --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) {
            throw "Backend npm ci failed with exit code $LASTEXITCODE."
          }
          & npm.cmd run build
          if ($LASTEXITCODE -ne 0) {
            throw "Backend build failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path -LiteralPath 'dist\main.js' -PathType Leaf)) {
            throw 'Built backend bundle is missing server\dist\main.js.'
          }
          & npm.cmd prune --omit=dev --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not prepare the production runtime dependencies.'
          }

      - name: Atomically release backend with health rollback
        env:
          ORIGIN_ROOT: ${{ steps.origin.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $origin = $env:ORIGIN_ROOT
          $logs = Join-Path $origin 'logs'
          $lock = Join-Path $logs 'deployment.lock'
          $marker = Join-Path $logs 'deployed-master-sha.txt'
          $current = Join-Path $origin 'server\dist'
          $next = Join-Path $origin 'server\dist.next'
          $previous = Join-Path $origin 'server\dist.previous'
          $failed = Join-Path $origin 'server\dist.failed'
          $source = Join-Path $env:GITHUB_WORKSPACE 'server\dist'

          function Get-OriginProcesses {
            @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object {
                $_.CommandLine -and (
                  ($_.Name -eq 'node.exe' -and $_.CommandLine -match 'server[\\/]dist[\\/]main\.js') -or
                  ($_.Name -eq 'node.exe' -and $_.CommandLine -match 'run-live-origin-supervisor\.cjs') -or
                  ($_.Name -eq 'powershell.exe' -and $_.CommandLine -match 'run-live-backend-supervisor\.ps1')
                )
              })
          }

          function Stop-OriginRuntime {
            # Disable, do not merely stop: the task is registered with
            # -RestartCount 999, so Task Scheduler treats a killed action as a
            # failure and revives the supervisor underneath us. Start-OriginRuntime
            # re-enables it (and the installer re-registers it enabled anyway).
            $task = Get-ScheduledTask -TaskName 'KobeOS-Live-Backend' -ErrorAction SilentlyContinue
            if ($task) {
              if ($task.State -eq 'Running') {
                Stop-ScheduledTask -TaskName 'KobeOS-Live-Backend' -ErrorAction SilentlyContinue
              }
              Disable-ScheduledTask -TaskName 'KobeOS-Live-Backend' -ErrorAction SilentlyContinue | Out-Null
            }

            $deadline = (Get-Date).AddSeconds(60)
            do {
              # Re-kill supervisors every pass, not once up front. A supervisor
              # that respawns after the first sweep is what keeps port 3000
              # occupied, and killing only the listener loses that race forever.
              foreach ($item in Get-OriginProcesses) {
                if ($item.ProcessId -and $item.ProcessId -ne $PID) {
                  Stop-Process -Id $item.ProcessId -Force -ErrorAction SilentlyContinue
                }
              }

              $listeners = @(Get-NetTCPConnection -State Listen -LocalPort 3000 -ErrorAction SilentlyContinue)
              if ($listeners.Count -eq 0) {
                Write-Host 'origin_runtime=stopped'
                return
              }
              foreach ($listener in $listeners) {
                $listenerProcess = Get-Process -Id $listener.OwningProcess -ErrorAction SilentlyContinue
                if (-not $listenerProcess) { continue }
                if ($listenerProcess.ProcessName -notmatch '^node(?:js)?$') {
                  Enable-ScheduledTask -TaskName 'KobeOS-Live-Backend' -ErrorAction SilentlyContinue | Out-Null
                  throw "Port 3000 is owned by $($listenerProcess.ProcessName) (PID $($listener.OwningProcess)); refusing to terminate it."
                }
                Stop-Process -Id $listener.OwningProcess -Force -ErrorAction SilentlyContinue
              }
              Start-Sleep -Seconds 1
            } while ((Get-Date) -lt $deadline)

            # Name whoever is still holding the port. A bare timeout here told us
            # nothing, and this step runs on a box we cannot inspect afterwards.
            $holding = @(Get-NetTCPConnection -State Listen -LocalPort 3000 -ErrorAction SilentlyContinue | ForEach-Object {
              $owner = Get-CimInstance Win32_Process -Filter "ProcessId=$($_.OwningProcess)" -ErrorAction SilentlyContinue
              "PID $($_.OwningProcess) $($owner.Name) :: $($owner.CommandLine)"
            })
            # Give the task back before failing: the release aborts here without
            # ever reaching Start-OriginRuntime, and a disabled task would leave
            # the origin unable to come back on its own after a reboot.
            Enable-ScheduledTask -TaskName 'KobeOS-Live-Backend' -ErrorAction SilentlyContinue | Out-Null
            throw "Timed out while stopping the KobeOS API runtime. Port 3000 still held by: $($holding -join ' | ')"
          }

          function Start-OriginRuntime {
            # Undo the stop-time disable before anything else, so a failure in
            # the installer below cannot leave the origin with a task that will
            # never start again on its own after a reboot.
            Enable-ScheduledTask -TaskName 'KobeOS-Live-Backend' -ErrorAction SilentlyContinue | Out-Null
            & powershell.exe -ExecutionPolicy Bypass -NoProfile -File "$env:GITHUB_WORKSPACE\scripts\install-live-backend-autostart.ps1" -RepoRoot $origin -SkipHealthCheck
            if ($LASTEXITCODE -ne 0) {
              throw "KobeOS origin supervisor restart failed with exit code $LASTEXITCODE."
            }
            Write-Host 'origin_runtime=start_requested'
          }

          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          foreach ($path in @($next, $failed)) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }
          Copy-Item -LiteralPath $source -Destination $next -Recurse -Force
          # Ship the exact runtime dependencies alongside dist so new imports
          # never depend on stale packages in the installed origin. Rollback
          # swaps this directory together with its dependencies.
          $dependencies = Join-Path $env:GITHUB_WORKSPACE 'server\node_modules'
          if (-not (Test-Path -LiteralPath $dependencies -PathType Container)) {
            throw 'Production runtime dependencies are missing; leaving the current release running.'
          }
          # robocopy, not Copy-Item: a dependency tree nests deep enough to pass
          # the 260-character path limit that Copy-Item still fails on, and an
          # abort here leaves the origin on its old release. /NP keeps the log
          # readable, /MT parallelises the many small files. robocopy signals
          # success with exit codes 0-7; 8 and above are real failures.
          & robocopy.exe $dependencies (Join-Path $next 'node_modules') /E /NFL /NDL /NJH /NJS /NP /R:2 /W:2 /MT:16 | Out-Null
          if ($LASTEXITCODE -ge 8) {
            throw "Copying the production runtime dependencies failed (robocopy exit code $LASTEXITCODE); leaving the current release running."
          }
          $global:LASTEXITCODE = 0
          Set-Content -LiteralPath $lock -Value '${{ github.sha }}' -Encoding ASCII

          try {
            Start-Sleep -Seconds 5
            Stop-OriginRuntime
            if (Test-Path -LiteralPath $previous) {
              Remove-Item -LiteralPath $previous -Recurse -Force
            }
            Move-Item -LiteralPath $current -Destination $previous
            Move-Item -LiteralPath $next -Destination $current
          } finally {
            Remove-Item -LiteralPath $lock -Force -ErrorAction SilentlyContinue
          }

          # Rotate the error log before the new backend starts. It is appended
          # to and never truncated, so both the failure classifier below and
          # the tail it prints were matching entries from previous releases —
          # a release in October was diagnosed from September's errors, about
          # columns whose code no longer exists. Whatever is in this file after
          # this point belongs to this release.
          # Every log run-live-origin-supervisor.cjs writes, in the order that
          # is useful when a release fails. The supervisor brings up embedded
          # PostgreSQL first and only then the API, so a silent backend usually
          # means the database never came up — which only the supervisor and
          # postgres logs can show.
          $originLogNames = @(
            'live-origin-supervisor.log',
            'kobe-backend-live.out.log',
            'kobe-backend-live.err.log',
            'kobe-postgres-live.err.log',
            'kobe-postgres-live.out.log',
            'live-origin-supervisor.stdout.log',
            'live-origin-supervisor.stderr.log'
          )
          $rotateStamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          foreach ($logName in $originLogNames) {
            $logPath = Join-Path $logs $logName
            if (Test-Path -LiteralPath $logPath -PathType Leaf) {
              Move-Item -LiteralPath $logPath -Destination "$logPath.$rotateStamp.prev" -Force
            }
          }
          Remove-Item -LiteralPath (Join-Path $logs 'live-origin-supervisor.state') `
            -Force -ErrorAction SilentlyContinue

          Start-OriginRuntime

          function Test-Release {
            try {
              $api = Invoke-RestMethod -Uri 'http://127.0.0.1:3000/api/health' -TimeoutSec 8
              $lala = Invoke-RestMethod -Uri 'http://127.0.0.1:3000/api/lala-public/health' -TimeoutSec 12
              $search = Invoke-RestMethod -Uri 'http://127.0.0.1:3000/api/lala-public/search' -TimeoutSec 15
              # Invoke-RestMethod successfully parsing the search response is the
              # local search gate. Windows PowerShell may unwrap a one-item JSON
              # array, so its runtime CLR type is not a reliable API contract.
              $null = $search
              return (
                $api.status -eq 'ok' -and
                $api.db -eq 'connected' -and
                $lala.status -eq 'ok' -and
                $lala.database -eq 'ready'
              )
            } catch {
              return $false
            }
          }

          $healthy = $false
          $deadline = (Get-Date).AddMinutes(4)
          do {
            if (Test-Release) {
              $healthy = $true
              break
            }
            Start-Sleep -Seconds 4
          } while ((Get-Date) -lt $deadline)

          if (-not $healthy) {
            function Write-EndpointDiagnostic([string]$Name, [string]$Uri) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri $Uri -TimeoutSec 8
                Write-Host "$Name=http_$($response.StatusCode)"
              } catch {
                $status = $null
                if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
                  $status = [int]$_.Exception.Response.StatusCode
                }
                if ($status) {
                  Write-Host "$Name=http_$status"
                } else {
                  Write-Host "$Name=unreachable"
                }
              }
            }

            Write-EndpointDiagnostic 'new_api_health' 'http://127.0.0.1:3000/api/health'
            Write-EndpointDiagnostic 'new_lala_health' 'http://127.0.0.1:3000/api/lala-public/health'
            Write-EndpointDiagnostic 'new_lala_search' 'http://127.0.0.1:3000/api/lala-public/search'

            # Read every log the supervisor actually writes. This used to look
            # only at kobe-backend-live.err.log, which nothing has written
            # since an older supervisor was replaced — so the classifier was
            # reading a file frozen in September and reporting its contents as
            # the current release's failure. Nest's Logger writes to stdout,
            # so the stdout log is where a boot failure actually appears.
            # The supervisor's one-word state is the most informative signal
            # there is: it says whether the database or the backend is the
            # thing that never came up. Report it first.
            $stateFile = Join-Path $logs 'live-origin-supervisor.state'
            if (Test-Path -LiteralPath $stateFile -PathType Leaf) {
              Write-Host "origin_supervisor_state=$((Get-Content -LiteralPath $stateFile -Raw).Trim())"
            } else {
              Write-Host 'origin_supervisor_state=absent'
            }

            # The supervisor can report whether it can even find a PostgreSQL
            # cluster and binaries, which is the usual reason it never reaches
            # the backend. Read-only.
            $nodeExe = Join-Path $env:ProgramFiles 'nodejs\node.exe'
            $supervisorEntry = Join-Path $env:GITHUB_WORKSPACE 'scripts\run-live-origin-supervisor.cjs'
            if ((Test-Path -LiteralPath $nodeExe -PathType Leaf) -and
                (Test-Path -LiteralPath $supervisorEntry -PathType Leaf)) {
              try {
                & $nodeExe $supervisorEntry --repo-root $origin --diagnose 2>&1 |
                  ForEach-Object { Write-Host $_ }
              } catch {
                Write-Host "origin_supervisor_diagnose=failed: $($_.Exception.Message)"
              }
            } else {
              Write-Host 'origin_supervisor_diagnose=skipped (node or supervisor entry not found)'
            }

            $logCandidates = $originLogNames | ForEach-Object { Join-Path $logs $_ }
            $parts = @()
            foreach ($candidate in $logCandidates) {
              if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
                Write-Host "log_absent=$(Split-Path -Leaf $candidate)"
                continue
              }
              $content = (Get-Content -LiteralPath $candidate -Tail 400 -ErrorAction SilentlyContinue) -join [Environment]::NewLine
              Write-Host "log_present=$(Split-Path -Leaf $candidate) bytes=$((Get-Item -LiteralPath $candidate).Length)"
              if ($content) { $parts += "----- $(Split-Path -Leaf $candidate) -----"; $parts += $content }
            }
            $tail = $parts -join [Environment]::NewLine

            $failureClass = 'unclassified'
            if ($tail) {
              if ($tail -match 'Cannot find module') {
                $failureClass = 'dependency_missing'
              } elseif ($tail -match 'relation .* does not exist') {
                $failureClass = 'migration_relation_missing'
              } elseif ($tail -match 'column .* does not exist') {
                $failureClass = 'migration_column_missing'
              } elseif ($tail -match 'ECONNREFUSED|connect ECONNREFUSED') {
                $failureClass = 'database_connection_failed'
              } elseif ($tail -match 'EADDRINUSE') {
                $failureClass = 'port_in_use'
              } elseif ($tail -match 'Nest can.?t resolve dependencies') {
                $failureClass = 'nest_dependency_resolution'
              } elseif ($tail -match 'postgres_binary_selection=missing|could not find pg_ctl|initdb') {
                $failureClass = 'postgres_binaries_missing'
              } elseif ($tail -match 'database system is starting up|the database system is shutting down') {
                $failureClass = 'postgres_not_ready'
              } elseif ($tail -match 'state=database_') {
                $failureClass = 'database_never_started'
              }
            }
            Write-Host "new_backend_failure_class=$failureClass"

            # Print the error itself, not only its category. Without this a
            # failed release says "migration_column_missing" and nothing more,
            # and the only way to learn WHICH column is to ask someone to open
            # a PowerShell prompt on the origin machine and read the log by
            # hand. Secrets are stripped: the connection error TypeORM raises
            # can carry the database password.
            if ($tail) {
              # Only an actual key=value / key: value pair. An earlier version
              # allowed a bare space as the separator, so the phrase
              # "creatorAttributionToken does not exist" came out as
              # "...Token *** not exist" — redaction eating the diagnosis.
              $redacted = $tail -replace '(?i)(password|secret|token|apikey|api_key)(\s*[:=]\s*)([^\s"'',;]+)', '$1$2***'
              Write-Host '##[group]new_backend_error_tail'
              ($redacted -split "`n" | Select-Object -Last 60) | ForEach-Object { Write-Host $_ }
              Write-Host '##[endgroup]'
            } else {
              Write-Host 'new_backend_error_tail=empty_or_missing (no supervisor log had content; see log_absent/log_present above)'
            }

            Write-Host 'New backend failed release health checks; restoring previous bundle.'
            Set-Content -LiteralPath $lock -Value 'rollback' -Encoding ASCII
            try {
              Start-Sleep -Seconds 5
              Stop-OriginRuntime
              if (Test-Path -LiteralPath $current) {
                Move-Item -LiteralPath $current -Destination $failed
              }
              Move-Item -LiteralPath $previous -Destination $current
            } finally {
              Remove-Item -LiteralPath $lock -Force -ErrorAction SilentlyContinue
            }
            Start-OriginRuntime

            $rollbackHealthy = $false
            $rollbackDeadline = (Get-Date).AddMinutes(3)
            do {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3000/api/health' -TimeoutSec 8
                if ($response.StatusCode -eq 200) {
                  $rollbackHealthy = $true
                  break
                }
              } catch { }
              Start-Sleep -Seconds 4
            } while ((Get-Date) -lt $rollbackDeadline)

            if (-not $rollbackHealthy) {
              throw 'New release failed and the previous backend did not recover.'
            }
            throw 'New release failed database-backed health checks; previous backend restored.'
          }

          Set-Content -LiteralPath $marker -Value '${{ github.sha }}' -Encoding ASCII
          Write-Host 'backend_release=success'

      - name: Deploy current Lala and Jumla bundles
        env:
          ORIGIN_ROOT: ${{ steps.origin.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(
            & "$env:GITHUB_WORKSPACE\scripts\deploy-public-pages-from-origin.ps1" -OriginRoot $env:ORIGIN_ROOT
          )
          $lines | ForEach-Object { Write-Host $_ }
          if ($lines -notcontains 'origin_pages_deploy=success') {
            throw 'Cloudflare Pages deployment did not run because usable origin credentials were not found.'
          }

  verify-off-box:
    name: Verify complete public MVP
    needs: release-origin
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify API, Lala, and Jumla
        shell: bash
        run: |
          set -euo pipefail

          retry_json() {
            url="$1"
            output="$2"
            for attempt in $(seq 1 12); do
              if curl -fsS --connect-timeout 10 --max-time 30 "$url" -o "$output"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          retry_json 'https://api.kobeapptz.com/api/health' /tmp/api-health.json
          jq -e '.status == "ok" and .db == "connected"' /tmp/api-health.json >/dev/null

          retry_json 'https://api.kobeapptz.com/api/lala-public/health' /tmp/lala-health.json
          jq -e '.status == "ok" and .database == "ready"' /tmp/lala-health.json >/dev/null

          retry_json 'https://api.kobeapptz.com/api/lala-public/search' /tmp/lala-search.json
          jq -e 'type == "array"' /tmp/lala-search.json >/dev/null

          retry_json 'https://api.kobeapptz.com/api/commerce-public/jumla/items?q=' /tmp/jumla-items.json
          jq -e 'type == "array"' /tmp/jumla-items.json >/dev/null

          for domain in lala.kobeapptz.com jumla.kobeapptz.com; do
            curl -fsS --retry 10 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 30 "https://$domain/" -o "/tmp/$domain.html"
            grep -q 'id="root"' "/tmp/$domain.html"
          done

          echo 'public_mvp_verification=success'
