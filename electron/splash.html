<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KobeOS Starting…</title>
  <link rel="stylesheet" href="./splash.css" />
</head>
<body>
  <div class="logo">KobeOS</div>
  <div class="tagline">Your Business. Your OS.</div>

  <div class="progress-track" role="progressbar" aria-label="KobeOS startup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="progress-fill" id="bar"></div>
  </div>
  <div class="status" id="status" aria-live="polite">Initializing…</div>

  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="version">v1.0.0</div>
</body>
</html>
